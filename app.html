/* Layout: cabeçalho fixo com abas; conteúdo em coluna única de até 1080px; listas em linhas que quebram no celular. */
:root{
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --bg:#EDF0F5; --surface:#FFFFFF; --ink:#101B2B; --muted:#58657A; --line:#D8DEE8;
  --accent:#2347C5; --accent-ink:#FFFFFF; --accent-soft:#E3E9FB; --bar:#BAC7F0;
  --good:#16704A; --good-soft:#DAF0E5; --warn:#8F5A08; --warn-soft:#FAEBC8; --bad:#B3261E; --bad-soft:#FBE2DF;
  --shadow:0 12px 40px rgba(16,27,43,.18); --scrim:rgba(16,27,43,.5);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C121D; --surface:#141C2A; --ink:#E8EDF5; --muted:#93A1B6; --line:#26324A;
    --accent:#8BA3F7; --accent-ink:#0C1220; --accent-soft:#1B2646; --bar:#34477F;
    --good:#4CC38A; --good-soft:#11301F; --warn:#E3AE4D; --warn-soft:#32260C; --bad:#F2857B; --bad-soft:#3A1714;
    --shadow:0 12px 40px rgba(0,0,0,.55); --scrim:rgba(0,0,0,.65);
    color-scheme:dark;
  }
}

*{box-sizing:border-box}
body{font:15px/1.5 var(--font-body);background:var(--bg);color:var(--ink)}

.tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}

.wrap{padding-block:20px 56px;display:grid;gap:16px}

.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.solid{background:var(--bad);color:var(--surface)}

.link{appearance:none;background:none;border:0;padding:0;font-weight:600;color:var(--ink);cursor:pointer;text-align:left}

.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}

.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--accent-soft);color:var(--accent)}

.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}

/* ---------- regras de cobrança ---------- */
function mensalDues(a,limit){
  var dv=Math.min(31,Math.max(1,Number(a.diaVenc)||1));
  var p=a.inicio.split('-').map(Number),y=p[0],m=p[1];
  var due=y+'-'+pad(m)+'-'+pad(Math.min(dv,lastDay(y,m)));
  if(d2n(due)<d2n(a.inicio)){m++;if(m>12){m=1;y++}due=y+'-'+pad(m)+'-'+pad(Math.min(dv,lastDay(y,m)))}
  var out=[],guard=0;
  while(d2n(due)<=d2n(limit)&&guard++<240){
    out.push({ref:due.slice(0,7),venc:due});
    m++;if(m>12){m=1;y++}
    due=y+'-'+pad(m)+'-'+pad(Math.min(dv,lastDay(y,m)));
  }
  return out;
}
function rowsFor(a,t){
  var pays=state.pagamentos.filter(function(p){return p.aluguelId===a.id});
  var list=[];
  if(a.modalidade==='mes'){
    var limit=a.encerradoEm?a.encerradoEm:addDays(t,7);
    list=mensalDues(a,limit).map(function(x){return{ref:x.ref,venc:x.venc,valor:Number(a.valorUnit)||0}});
  }else{
    var fim=a.fim||a.inicio;
    var ef=a.devolucao&&a.devolucao>fim?a.devolucao:fim;
    var dias=Math.max(1,d2n(ef)-d2n(a.inicio));
    list=[{ref:'total',venc:ef,valor:fromC(toC(a.valorUnit)*dias),dias:dias}];
  }
  return list.map(function(r){
    var pago=sumBy(pays.filter(function(p){return p.ref===r.ref}),function(p){return p.valor});
    var saldoC=Math.max(0,toC(r.valor)-toC(pago)),saldo=fromC(saldoC);
    var delta=d2n(r.venc)-d2n(t),status;
    if(saldo<=0)status='pago';else if(delta<0)status='atrasado';else if(delta===0)status='hoje';else status='aberto';
    var multa=0,juros=0,atraso=-delta;
    if(status==='atrasado'&&atraso>(Number(cfg.carencia)||0)){
      var multaC=rndC(saldoC*(Number(cfg.multa)||0)/100),jurosC=rndC(saldoC*(Number(cfg.juros)||0)/100/30*atraso);
      multa=fromC(multaC);juros=fromC(jurosC);
    }
    var enc=fromC(toC(multa)+toC(juros));
    return{ref:r.ref,venc:r.venc,valor:r.valor,dias:r.dias,aluguelId:a.id,a:a,pago:pago,saldo:saldo,status:status,delta:delta,multa:multa,juros:juros,enc:enc,total:fromC(toC(saldo)+toC(enc))};
  });
}
function compute(){
  var t=todayStr(),lim=addDays(t,7);
  var cli={},itm={};
  state.clientes.forEach(function(c){cli[c.id]=c});
  state.itens.forEach(function(i){itm[i.id]=i});
  var byAl={},rows=[];
  state.alugueis.forEach(function(a){
    if(!a.inicio){byAl[a.id]=[];return}
    var r=rowsFor(a,t);byAl[a.id]=r;rows=rows.concat(r);
  });
  var open=rows.filter(function(r){return r.status!=='pago'}).sort(function(x,y){return x.venc<y.venc?-1:x.venc>y.venc?1:0});
  var late=open.filter(function(r){return r.status==='atrasado'});
  var soon=open.filter(function(r){return r.status!=='atrasado'&&r.venc<=lim});
  var mes=t.slice(0,7);
  var recebidoMes=sumBy(state.pagamentos.filter(function(p){return(p.data||'').slice(0,7)===mes}),function(p){return p.valor});
  var nPagMes=state.pagamentos.filter(function(p){return(p.data||'').slice(0,7)===mes}).length;
  var ativos=state.alugueis.filter(function(a){return a.status!=='encerrado'});
  var equip=state.itens.filter(function(i){return i.tipo!=='assinatura'});
  var ids={};ativos.forEach(function(a){ids[a.itemId]=true});
  var equipAlugados=equip.filter(function(i){return ids[i.id]});
  var hasEx=[].concat(state.clientes,state.itens,state.alugueis,state.pagamentos,state.despesas,state.despPag).some(function(x){return x.exemplo});
  var dr=despRowsAll(t),dOpen=dr.filter(function(r){return r.status!=='pago'}).sort(function(x,y){return x.venc<y.venc?-1:x.venc>y.venc?1:0});
  var dLate=dOpen.filter(function(r){return r.status==='atrasado'});
  var dSoon=dOpen.filter(function(r){return r.status!=='atrasado'&&r.venc<=lim});
  var assMap={};state.assDig.forEach(function(x){assMap[x.id]=x});
  var ct={};state.contatos.forEach(function(x){ct[x.id]=x});
  var hoje=open.filter(function(r){return r.status==='atrasado'||r.status==='hoje'}).sort(function(x,y){return x.venc<y.venc?-1:x.venc>y.venc?1:(y.total-x.total)});
  return{ct:ct,hoje:hoje,t:t,lim:lim,cli:cli,itm:itm,byAl:byAl,rows:rows,open:open,late:late,soon:soon,recebidoMes:recebidoMes,nPagMes:nPagMes,dr:dr,dOpen:dOpen,dLate:dLate,dSoon:dSoon,assMap:assMap,
    ativos:ativos,equip:equip,equipAlugados:equipAlugados,hasEx:hasEx,
    aReceber:sumBy(open,function(r){return r.total}),atrasoValor:sumBy(late,function(r){return r.total})};
}
function alStatus(a){
  var r=D.byAl[a.id]||[];
  var saldo=sumBy(r,function(x){return x.saldo});
  var late=r.some(function(x){return x.status==='atrasado'});
  if(a.status==='encerrado')return saldo>0?{k:'warn',t:'Encerrado com saldo'}:{k:'mute',t:'Encerrado'};
  if(late)return{k:'bad',t:'Em atraso'};
  if(a.modalidade!=='mes'&&(a.fim||a.inicio)<D.t)return{k:'warn',t:'Devolução pendente'};
  return{k:'good',t:'Em dia'};
}

function pillCob(r){

  var ph=((c&&c.telefone)||'').replace(/\D/g,'');

  return'https://wa.me/'+ph+'?text='+encodeURIComponent(text);
}
function waMsg(r){

function chartHtml(){
  var now=new Date(),items=[];
  for(var k=5;k>=0;k--){
    var d=new Date(now.getFullYear(),now.getMonth()-k,1);
    items.push({key:d.getFullYear()+'-'+pad(d.getMonth()+1),label:MESES[d.getMonth()],v:0});
  }
  state.pagamentos.forEach(function(p){
    var key=(p.data||'').slice(0,7);
    for(var i=0;i<items.length;i++){if(items[i].key===key)items[i].v+=Number(p.valor)||0}
  });
  var max=Math.max.apply(null,[1].concat(items.map(function(x){return x.v})));
  return'<div class="chart" role="img" aria-label="Valor recebido por mês, em reais, nos últimos seis meses">'+items.map(function(x,i){
    return'<div class="bar"><div class="bar-v">'+(x.v?COMPACT.format(x.v):'–')+'</div><div class="bar-t"><i class="'+(i===5?'cur':'')+'" style="height:'+Math.round(x.v/max*100)+'%"></i></div><div class="bar-l">'+x.label+'</div></div>';

}

}
modalEl.addEventListener('submit',function(e){

  var ok=document.getElementById('m-ok'),err=document.getElementById('m-err');
  err.hidden=true;if(ok)ok.disabled=true;
  Promise.resolve().then(function(){return fn(form)}).then(function(){closeModal()},function(ex){

  });
});

function dbErr(e){
  var c=e&&e.code;
  if(c==='invalid_argument')return'Não foi possível salvar. Confira se você tem permissão de edição neste artefato.';
  if(c==='quota_exceeded')return'O limite de armazenamento foi atingido. Apague registros que não usa mais.';
  if(c==='resource_exhausted'||c==='unavailable')return'O servidor está ocupado. Tente de novo em instantes.';
  if(c==='revoked')return'Seu acesso mudou. Recarregue a página.';
  return(e&&e.message)||'Erro ao salvar.';
}
function w(fn){
  return Promise.resolve().then(fn).catch(function(e){throw new Error(e instanceof Error&&!e.code?e.message:dbErr(e))});

/* ---------- Cartões de crédito e faturas ---------- */
/* Regra: compra feita até o dia do fechamento entra na fatura que fecha neste mês; depois disso, na do mês seguinte.
   A compra não é despesa da conta até pagar a fatura: ao pagar, entra UMA despesa na conta (sem contar duas vezes). */
function fatMesDe(c,data){var ym=data.slice(0,7),d=Number(data.slice(8,10));return d>Number(c.diaFech)?moveMes(ym,1):ym}
function fatVencMes(c,m){return Number(c.diaVenc)>Number(c.diaFech)?m:moveMes(m,1)}
function fatVencData(c,m){return fatVencMes(c,m)+'-'+pad(Number(c.diaVenc))}
function fatFechData(c,m){return m+'-'+pad(Number(c.diaFech))}
function cartaoNome(id){var c=state.fcartoes.find(function(x){return x.id===id});return c?c.nome:'Cartão removido'}
function fatPagaDoc(cid,m){return state.flanc.find(function(l){return l.faturaId===cid+'_'+m&&l.estado==='efetivado'&&!l.estornadoPor})||null}
function ccSinal(l){return l.tipo==='credito'?-1:1}
function ccNeutro(l){return!!(l.estornadoPor||l.estornaId)}
function fatItens(cid,m){return state.fclanc.filter(function(l){return l.cartaoId===cid&&l.faturaMes===m}).sort(function(a,b){return a.dataCompra<b.dataCompra?-1:a.dataCompra>b.dataCompra?1:(a.criadoEm||0)-(b.criadoEm||0)})}
function fatTotalC(cid,m){var s=0;fatItens(cid,m).forEach(function(l){s+=ccSinal(l)*toC(l.valor)});return s}
function fatStatus(c,m){
  if(fatPagaDoc(c.id,m))return'paga';
  return D.t>fatFechData(c,m)?'fechada':'aberta';
}
function cartaoUsadoC(c){
  var s=0,pagas={};
  state.fclanc.forEach(function(l){
    if(l.cartaoId!==c.id)return;
    var k=l.faturaMes;if(!(k in pagas))pagas[k]=!!fatPagaDoc(c.id,k);
    if(!pagas[k])s+=ccSinal(l)*toC(l.valor);
  });
  return s;
}
function fatPill(c,m){
  var s=fatStatus(c,m),t=fatTotalC(c.id,m);
  if(s==='paga')return'<span class="pill good">Paga</span>';
  if(s==='fechada')return fatVencData(c,m)<D.t?'<span class="pill bad">Vencida</span>':'<span class="pill warn">Fechada, a pagar</span>';
  return'<span class="pill info">Aberta</span>';
}

/* ---------- Orçamento, metas e patrimônio (só administrador) ---------- */
/* Orçamento: limite mensal por categoria, com vigência («vale a partir de»). Mudar o limite cria uma nova vigência; os meses
   anteriores mantêm o limite que tinham. Despesas efetivadas e compras no cartão contam como gasto; o que ainda está previsto
   aparece à parte. O pagamento da fatura não conta (as compras já contaram), para não somar duas vezes.
   Metas: valor-alvo, prazo e progresso (por aportes manuais ou pelo saldo de uma conta). Patrimônio: contas menos cartões. */
var ORC_TOTAL='__total';
function orcKey(c){return slug(c)||'sem-categoria'}
function catLabel(c){return String(c||'').trim()||'Sem categoria'}
function orcMesAtual(){return D.t.slice(0,7)}
function ultimoDiaMes(m){var p=m.split('-').map(Number);return m+'-'+pad(new Date(Date.UTC(p[0],p[1],0)).getUTCDate())}
function isoDia(ms){var d=new Date(ms);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function orcLimiteDe(key,mes){
  var best=null;
  state.forc.forEach(function(o){if(o.ckey===key&&o.desde<=mes&&(!best||o.desde>best.desde))best=o});
  return best&&!best.encerrado?best:null;
}
function orcGasto(mes){
  var cats={},totR=0,totP=0,hoje=D.t.slice(0,7);
  function add(cat,vC,real){
    var k=orcKey(cat),o=cats[k]||(cats[k]={key:k,label:catLabel(cat),realC:0,prevC:0});
    if(real){o.realC+=vC;totR+=vC}else{o.prevC+=vC;totP+=vC}
  }
  state.flanc.forEach(function(l){
    if(l.tipo!=='despesa'||finNeutro(l)||l.faturaId)return;
    if(finDataRef(l).slice(0,7)!==mes)return;
    add(l.categoria,toC(l.valor),l.estado==='efetivado');
  });
  state.fclanc.forEach(function(l){
    if(ccNeutro(l))return;
    var m=moveMes(String(l.dataCompra).slice(0,7),(Number(l.parcela)||1)-1);
    if(m!==mes)return;
    add(l.categoria,ccSinal(l)*toC(l.valor),l.dataCompra<=D.t&&m<=hoje);
  });
  return{cats:cats,totR:totR,totP:totP};
}
function orcNivel(realC,limC){if(limC<=0)return 0;if(realC>=limC)return 100;if(realC*10>=limC*9)return 90;if(realC*10>=limC*7)return 70;return 0}
function orcPct(realC,limC){return limC>0&&realC>0?Math.floor(realC*100/limC):0}
function orcLinhas(mes){
  var g=orcGasto(mes),linhas=[],vistos={},ativos={};
  state.forc.forEach(function(o){vistos[o.ckey]=o});
  Object.keys(vistos).forEach(function(k){
    var o=orcLimiteDe(k,mes);if(!o)return;
    ativos[k]=1;
    var limC=toC(o.limite),real,prev,label;
    if(k===ORC_TOTAL){real=g.totR;prev=g.totP;label='Todas as despesas'}
    else{var c=g.cats[k]||{realC:0,prevC:0};real=c.realC;prev=c.prevC;label=o.categoria}
    linhas.push({key:k,label:label,limC:limC,realC:real,prevC:prev,pct:orcPct(real,limC),nivel:orcNivel(real,limC),nivelProj:orcNivel(real+prev,limC),total:k===ORC_TOTAL,desde:o.desde});
  });
  linhas.sort(function(a,b){return a.total!==b.total?(a.total?-1:1):(b.pct-a.pct)||String(a.label).localeCompare(String(b.label),'pt-BR')});
  var sem=Object.keys(g.cats).filter(function(k){return!ativos[k]&&(g.cats[k].realC||g.cats[k].prevC)}).map(function(k){return g.cats[k]}).sort(function(a,b){return b.realC-a.realC});
  return{linhas:linhas,sem:sem,g:g};
}
function orcAlertas(mes){return orcLinhas(mes).linhas.filter(function(x){return x.nivel>0||(x.nivelProj>=100&&x.nivel<100)})}
function orcTexto(x){
  var f=function(c){return money(fromC(c))};
  if(x.nivel===100)return(x.realC>x.limC?'Passou do limite em '+f(x.realC-x.limC)+': ':'Chegou a 100% do limite: ')+'gastou '+f(x.realC)+' de '+f(x.limC)+'.';
  if(x.nivel===90)return'Atenção, já usou '+x.pct+'% do limite: gastou '+f(x.realC)+' de '+f(x.limC)+'. Faltam '+f(x.limC-x.realC)+'.';
  if(x.nivel===70)return'Aviso, já usou '+x.pct+'% do limite: gastou '+f(x.realC)+' de '+f(x.limC)+'. Faltam '+f(x.limC-x.realC)+'.';
  if(x.nivelProj>=100)return'Com o que ainda está previsto ('+f(x.prevC)+'), o mês passa do limite: '+f(x.realC+x.prevC)+' de '+f(x.limC)+'.';
  return'Dentro do limite: gastou '+f(x.realC)+' de '+f(x.limC)+'.';
}
function orcBarra(pct,nivel,rotulo){
  var cor=nivel>=100?'var(--bad)':nivel>=70?'var(--warn)':'var(--good)',wd=Math.max(0,Math.min(100,pct));
  return'<div role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+wd+'" aria-label="'+esc(rotulo)+'" style="height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px"><i style="display:block;height:100%;width:'+wd+'%;background:'+cor+'"></i></div>';
}

  var rows=r.linhas.length?r.linhas.map(function(x){

  }).join(''):'<div class="row"><div class="r-main muted">Nenhum limite neste mês. Toque em «Definir limite» e escolha uma categoria (ou todas as despesas). Você recebe aviso a partir de 70%, 90% e 100%.</div></div>';
  var sem=r.sem.length?'<section class="panel"><div class="panel-h"><h2>Gastos sem limite</h2></div>'+r.sem.map(function(c){return'<div class="row"><div class="r-main"><strong>'+esc(c.label)+'</strong><div class="sub">Gasto '+f(c.realC)+(c.prevC?' · previsto '+f(c.prevC):'')+'</div></div><div class="r-act"><button type="button" class="btn sm" data-act="orc-novo" data-id="'+esc(c.label)+'">Definir limite</button></div></div>'}).join('')+'</section>':'';
  var resumo='<div class="sumline" style="padding-top:12px">Gasto do mês: <strong>'+f(r.g.totR)+'</strong>'+(r.g.totP?' · ainda previsto: '+f(r.g.totP):'')+'</div>';

/* ----- metas ----- */
function metaAtualC(m){
  if(m.contaId){var c=state.fcontas.find(function(x){return x.id===m.contaId});return c?finSaldoC(c):0}
  var s=0;state.faportes.forEach(function(a){if(a.metaId===m.id)s+=(a.tipo==='retirada'?-1:1)*toC(a.valor)});
  return s;
}
function metaMesesRestantes(m){
  if(!m.prazo)return 0;
  if(m.prazo<D.t)return 0;
  var a=D.t.slice(0,7).split('-').map(Number),b=m.prazo.slice(0,7).split('-').map(Number);
  return Math.max(1,(b[0]*12+b[1])-(a[0]*12+a[1]));
}
function metaInfo(m){
  var alvoC=toC(m.alvo),atual=metaAtualC(m),falta=Math.max(0,alvoC-atual),meses=metaMesesRestantes(m);
  var pct=alvoC>0&&atual>0?Math.min(100,Math.floor(atual*100/alvoC)):0;
  var estado=atual>=alvoC?'concluida':(m.prazo&&m.prazo<D.t?'atrasada':'andamento');
  var porMes=meses>0&&falta>0?Math.ceil(falta/meses):0;
  return{alvoC:alvoC,atual:atual,falta:falta,meses:meses,pct:pct,estado:estado,porMes:porMes};
}
function viewMetas(){
  var f=function(c){return money(fromC(c))};
  var ativas=state.fmetas.filter(function(m){return m.ativa!==false}).sort(function(a,b){return String(a.prazo||'9').localeCompare(String(b.prazo||'9'))||String(a.nome).localeCompare(String(b.nome),'pt-BR')});
  var arq=state.fmetas.filter(function(m){return m.ativa===false}).sort(byNome);
  var rows=ativas.length?ativas.map(function(m){
    var i=metaInfo(m),bt=function(act,label,cls){return'<button type="button" class="btn sm'+(cls?' '+cls:'')+'" data-act="'+act+'" data-id="'+esc(m.id)+'">'+label+'</button>'};
    var pill=i.estado==='concluida'?'<span class="pill good">Concluída</span>':i.estado==='atrasada'?'<span class="pill bad">Prazo vencido</span>':'<span class="pill info">Em andamento</span>';
    var sub=f(i.atual)+' de '+f(i.alvoC)+' ('+i.pct+'%)'+(m.prazo?' · prazo '+fmtDate(m.prazo):'')+(i.falta>0?' · faltam '+f(i.falta):'')+(i.porMes>0?' · guardar '+f(i.porMes)+' por mês ('+i.meses+(i.meses===1?' mês':' meses')+')':'')+(m.contaId?' · acompanha o saldo de '+esc(finContaNome(m.contaId)):' · aportes manuais');
    var ac=(m.contaId?'':bt('meta-aporte','Aporte','primary'))+bt('meta-hist','Aportes')+bt('meta-edit','Editar');
    return'<div class="row" data-meta="'+esc(m.id)+'"><div class="r-main"><strong>'+esc(m.nome)+'</strong> '+pill+'<div class="sub">'+sub+'</div>'+orcBarra(i.pct,i.estado==='concluida'?0:i.estado==='atrasada'?100:0,m.nome+': '+i.pct+'% da meta')+'</div><div class="r-act">'+ac+'</div></div>';
  }).join(''):'<div class="row"><div class="r-main muted">Nenhuma meta ainda. Crie uma (reserva de emergência, viagem, entrada de um bem) e acompanhe quanto falta e quanto guardar por mês.</div></div>';
  var arqH=arq.length?'<section class="panel"><div class="panel-h"><h2>Metas arquivadas</h2></div>'+arq.map(function(m){return'<div class="row"><div class="r-main"><strong>'+esc(m.nome)+'</strong><div class="sub">'+f(metaAtualC(m))+' de '+f(toC(m.alvo))+'</div></div><div class="r-act"><button type="button" class="btn sm" data-act="meta-arq" data-id="'+esc(m.id)+'">Reativar</button></div></div>'}).join('')+'</section>':'';
  return'<div class="toolbar"><div></div><button type="button" class="btn primary" data-act="meta-nova">Nova meta</button></div><section class="panel list-wide">'+rows+'<div class="hint" style="padding:10px 16px 14px">Aporte manual é só uma anotação do que você separou: não move dinheiro entre contas. Para a meta acompanhar o dinheiro de verdade, ligue-a ao saldo de uma conta. Aporte lançado não se altera: use Estornar.</div></section>'+arqH;
}
function openMeta(id){

    return w(function(){return m?db.doc('fin_metas/'+id).set(doc):db.collection('fin_metas').add(doc)}).then(function(){toast(m?'Meta atualizada.':'Meta criada.')});

/* ----- patrimônio ----- */
/* Em uma data: soma dos saldos das contas (só o que já estava efetivado até a data) menos o que se deve nos cartões
   (todas as compras até a data, inclusive parcelas futuras, menos as faturas já pagas). */
function patrimonioEm(data,porTipo){
  var ativosC=0,tipos={};
  state.fcontas.forEach(function(c){
    if(c.criadoEm&&isoDia(c.criadoEm)>data)return;
    var s=toC(c.saldoInicial);
    state.flanc.forEach(function(l){
      if(l.estado!=='efetivado'||finDataRef(l)>data)return;
      var v=toC(l.valor);
      if(l.tipo==='receita'&&l.contaId===c.id)s+=v;
      else if(l.tipo==='despesa'&&l.contaId===c.id)s-=v;
      else if(l.tipo==='transferencia'){if(l.contaId===c.id)s-=v;if(l.contaDestinoId===c.id)s+=v}
    });
    ativosC+=s;tipos[c.tipo]=(tipos[c.tipo]||0)+s;
  });
  var dividaC=0;
  state.fclanc.forEach(function(l){if(String(l.dataCompra)<=data)dividaC+=ccSinal(l)*toC(l.valor)});
  state.flanc.forEach(function(l){
    if(l.estado!=='efetivado'||finDataRef(l)>data)return;
    if(l.faturaId&&l.tipo==='despesa')dividaC-=toC(l.valor);
    else if(l.estornaId){var o=state.flanc.find(function(x){return x.id===l.estornaId});if(o&&o.faturaId&&o.tipo==='despesa')dividaC+=toC(l.valor)}
  });
  return{ativosC:ativosC,dividaC:dividaC,liquidoC:ativosC-dividaC,tipos:tipos};
}
function viewPatrimonio(){
  var f=function(c){return money(fromC(c))},hoje=D.t,p=patrimonioEm(hoje);
  var contasL=state.fcontas.map(function(c){return{c:c,s:finSaldoC(c)}}).filter(function(x){return x.c.ativa!==false||x.s!==0}).sort(function(a,b){return String(a.c.nome).localeCompare(String(b.c.nome),'pt-BR')});
  var rowsC=contasL.length?contasL.map(function(x){return'<div class="row"><div class="r-main"><strong>'+esc(x.c.nome)+'</strong><div class="sub">'+esc(FIN_TIPOS[x.c.tipo]||'')+(x.c.ativa===false?' · arquivada':'')+'</div></div><div class="r-amt"><span class="amt'+(x.s<0?' bad':'')+'">'+f(x.s)+'</span></div></div>'}).join(''):'<div class="row"><div class="r-main muted">Cadastre suas contas em «Contas e lançamentos».</div></div>';
  var atual=0,futuro=0,rowsK='';
  state.fcartoes.slice().sort(byNome).forEach(function(c){
    var mAtual=fatMesDe(c,hoje),pagas={},a=0,fu=0;
    state.fclanc.forEach(function(l){
      if(l.cartaoId!==c.id)return;
      var k=l.faturaMes;if(!(k in pagas))pagas[k]=!!fatPagaDoc(c.id,k);
      if(pagas[k])return;
      if(k<=mAtual)a+=ccSinal(l)*toC(l.valor);else fu+=ccSinal(l)*toC(l.valor);
    });
    atual+=a;futuro+=fu;
    if(a||fu||c.ativo!==false)rowsK+='<div class="row"><div class="r-main"><strong>'+esc(c.nome)+'</strong><div class="sub">Faturas em aberto '+f(a)+(fu?' · parcelas de meses futuros '+f(fu):'')+'</div></div><div class="r-amt"><span class="amt bad">'+f(a+fu)+'</span></div></div>';
  });
  var pontos=[];
  for(var i=5;i>=0;i--){var m=moveMes(hoje.slice(0,7),-i),dt=i===0?hoje:ultimoDiaMes(m),q=patrimonioEm(dt);pontos.push({m:m,q:q})}
  var mx=0;pontos.forEach(function(x){mx=Math.max(mx,Math.abs(x.q.liquidoC))});
  var hist=pontos.map(function(x){
    var wd=mx>0?Math.round(Math.abs(x.q.liquidoC)*100/mx):0;
    return'<div class="row"><div class="r-main"><strong>'+esc(mesLabel(x.m))+'</strong><div class="sub">Contas '+f(x.q.ativosC)+' · cartões '+f(x.q.dividaC)+'</div><div aria-hidden="true" style="height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px"><i style="display:block;height:100%;width:'+wd+'%;background:'+(x.q.liquidoC<0?'var(--bad)':'var(--accent)')+'"></i></div></div><div class="r-amt"><span class="amt'+(x.q.liquidoC<0?' bad':'')+'">'+f(x.q.liquidoC)+'</span></div></div>';
  }).join('');
  var resumo='<div class="sumline" style="padding-top:12px">Contas: <strong>'+f(p.ativosC)+'</strong> · Cartões a pagar: <strong>'+f(p.dividaC)+'</strong> · Patrimônio líquido: <strong id="pat-liq">'+f(p.liquidoC)+'</strong>'+(futuro?' · sem as parcelas futuras: '+f(p.ativosC-atual):'')+'</div>';
  return'<div class="grid2"><div class="stack"><section class="panel"><div class="panel-h"><h2>Patrimônio hoje</h2></div>'+resumo+'<div class="hint" style="padding:6px 16px 14px">Patrimônio líquido = saldo das contas menos o que você deve nos cartões. As parcelas de compras já feitas contam como dívida, mesmo as de meses futuros.</div></section>'+
    '<section class="panel"><div class="panel-h"><h2>Contas</h2></div>'+rowsC+'</section>'+
    '<section class="panel"><div class="panel-h"><h2>Cartões</h2></div>'+(rowsK||'<div class="row"><div class="r-main muted">Nenhum cartão.</div></div>')+'</section></div>'+
    '<div class="stack"><section class="panel"><div class="panel-h"><h2>Últimos 6 meses</h2></div>'+hist+'<div class="hint" style="padding:10px 16px 14px">Calculado com o que está lançado até o fim de cada mês. Meses anteriores ao cadastro da conta aparecem sem ela.</div></section></div></div>';
}

/* ---------- Importação de extrato (OFX / CSV) ---------- */
/* O arquivo é lido só no aparelho. Valores viram centavos inteiros por leitura do texto (nunca por número decimal).
   Cada transação ganha um código fixo (conta + FITID, ou data+valor+descrição+ordem), então importar o mesmo extrato
   duas vezes, ou dois extratos que se sobrepõem, nunca duplica. Nada é marcado como pago sem você conferir a prévia. */
function impFnv(s,seed){var h=seed>>>0;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return('00000000'+h.toString(16)).slice(-8)}
function impHash(s){return impFnv(s,2166136261)+impFnv(s,374761393)}
function impNorm(s){return slug(s).replace(/\d+/g,'').replace(/-+/g,'-').replace(/^-|-$/g,'').split('-').slice(0,3).join('-')}
function impCents(str){
  var s=String(str==null?'':str).trim(),neg=false,extra='';
  if(!s)return NaN;
  if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1)}
  s=s.replace(/R\$|\s/g,'');
  if(s.charAt(0)==='-'){neg=!neg;s=s.slice(1)}else if(s.charAt(0)==='+')s=s.slice(1);
  if(s.slice(-1)==='-'){neg=!neg;s=s.slice(0,-1)}
  if(!s)return NaN;
  var lc=s.lastIndexOf(','),lp=s.lastIndexOf('.'),dec=lc>lp?',':lp>lc?'.':'',ip=s,fp='';
  if(dec){
    var i=s.lastIndexOf(dec);ip=s.slice(0,i);fp=s.slice(i+1);
    var outro=dec===','?'.':',';
    if(dec==='.'&&fp.length===3&&ip.length>=1&&ip.length<=3&&s.indexOf('.')===i&&s.indexOf(',')<0){ip=ip+fp;fp=''}   /* 1.234 = mil duzentos e trinta e quatro */
  }
  ip=ip.replace(/[.,]/g,'');
  if(!/^\d*$/.test(ip)||!/^\d*$/.test(fp))return NaN;
  var up=false;
  if(fp.length>2){up=fp.charAt(2)>='5';fp=fp.slice(0,2)}
  fp=(fp+'00').slice(0,2);
  var c=Number(ip||'0')*100+Number(fp)+(up?1:0);
  return neg?-c:c;
}
function impValida(y,m,d){y=Number(y);m=Number(m);d=Number(d);if(!(m>=1&&m<=12)||!(d>=1&&d<=new Date(Date.UTC(y,m,0)).getUTCDate()))return'';return y+'-'+pad(m)+'-'+pad(d)}
function impData(s){
  s=String(s||'').trim();var m;
  if((m=s.match(/^(\d{4})(\d{2})(\d{2})/)))return impValida(m[1],m[2],m[3]);
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)))return impValida(m[1],m[2],m[3]);
  if((m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/)))return impValida(m[3].length===2?'20'+m[3]:m[3],m[2],m[1]);
  return'';
}
function impOfx(txt){
  var out={formato:'OFX',itens:[],ignoradas:0,saldoC:null,saldoData:'',acct:''};
  var am=txt.match(/<ACCTID>([^<\r\n]*)/i);if(am)out.acct=am[1].trim();
  var bm=txt.match(/<LEDGERBAL>[\s\S]*?<BALAMT>\s*([^<\r\n]*)[\s\S]*?<DTASOF>\s*([^<\r\n]*)/i);
  if(bm){var bc=impCents(bm[1]);if(!isNaN(bc)){out.saldoC=bc;out.saldoData=impData(bm[2])}}
  txt.split(/<STMTTRN>/i).slice(1).forEach(function(b){
    b=b.split(/<\/STMTTRN>/i)[0];
    var tag=function(n){var m=b.match(new RegExp('<'+n+'>\\s*([^<\\r\\n]*)','i'));return m?m[1].trim():''};
    var data=impData(tag('DTPOSTED')),c=impCents(tag('TRNAMT'));
    if(!data||isNaN(c)||c===0){out.ignoradas++;return}
    out.itens.push({data:data,c:c,desc:(tag('MEMO')||tag('NAME')||tag('TRNTYPE')).replace(/&amp;/g,'&'),fitid:tag('FITID')});
  });
  return out;
}
function impCsvLinhas(txt){
  txt=txt.replace(/^﻿/,'');
  var primeira=(txt.split(/\r?\n/).filter(function(l){return l.trim()})[0])||'',dl=';',mx=-1;
  [';','\t',','].forEach(function(d){var c=primeira.split(d).length-1;if(c>mx){mx=c;dl=d}});
  var rows=[],row=[],cur='',q=false;
  for(var i=0;i<txt.length;i++){
    var ch=txt.charAt(i);
    if(q){if(ch==='"'){if(txt.charAt(i+1)==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;
    else if(ch===dl){row.push(cur);cur=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&txt.charAt(i+1)==='\n')i++;row.push(cur);cur='';if(row.some(function(x){return String(x).trim()}))rows.push(row);row=[]}
    else cur+=ch;
  }
  row.push(cur);if(row.some(function(x){return String(x).trim()}))rows.push(row);
  return rows;
}
function impCsv(txt){
  var out={formato:'CSV',itens:[],ignoradas:0,saldoC:null,saldoData:'',acct:'',erro:''};
  var rows=impCsvLinhas(txt),nm=function(c){return String(c||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim()};
  var h=-1,col={};
  for(var r=0;r<rows.length&&r<30;r++){
    var cs=rows[r].map(nm),c={data:-1,valor:-1,deb:-1,cred:-1,desc:-1,id:-1};
    cs.forEach(function(x,i){
      if(c.data<0&&/^(data|date)/.test(x))c.data=i;
      else if(c.valor<0&&/^(valor|amount|montante|value)/.test(x))c.valor=i;
      else if(c.deb<0&&/^(debito|saida|debit)/.test(x))c.deb=i;
      else if(c.cred<0&&/^(credito|entrada|credit)/.test(x))c.cred=i;
      else if(c.id<0&&/^(id$|identificador|fitid|codigo|documento|nsu)/.test(x))c.id=i;
      else if(c.desc<0&&/(descri|historico|memo|estabelec|lancamento|title|titulo|detalhe|nome)/.test(x))c.desc=i;
    });
    if(c.data>=0&&(c.valor>=0||c.deb>=0||c.cred>=0)){h=r;col=c;break}
  }
  if(h<0){out.erro='Não encontrei as colunas de data e valor. O arquivo precisa ter uma linha de títulos, como Data, Descrição e Valor.';return out}
  rows.slice(h+1).forEach(function(cells){
    var data=impData(cells[col.data]),c;
    if(col.valor>=0)c=impCents(cells[col.valor]);
    else{
      var d=col.deb>=0?impCents(cells[col.deb]):NaN,k=col.cred>=0?impCents(cells[col.cred]):NaN;
      c=(isNaN(k)?0:Math.abs(k))-(isNaN(d)?0:Math.abs(d));if(isNaN(d)&&isNaN(k))c=NaN;
    }
    if(!data||isNaN(c)||c===0){out.ignoradas++;return}
    out.itens.push({data:data,c:c,desc:String(col.desc>=0?cells[col.desc]:'').trim(),fitid:col.id>=0?String(cells[col.id]||'').trim():''});
  });
  return out;
}
function impLer(txt){
  var t=txt.slice(0,4000);
  return/<OFX|<STMTTRN|OFXHEADER/i.test(t)||/<STMTTRN>/i.test(txt)?impOfx(txt):impCsv(txt);
}
function impDecodifica(buf){
  try{return new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){try{return new TextDecoder('windows-1252').decode(buf)}catch(e2){return new TextDecoder().decode(buf)}}
}
function impPrepara(rd,cid){
  var cont={};
  rd.itens.forEach(function(it){
    var base=it.fitid?'f|'+it.fitid:'d|'+it.data+'|'+it.c+'|'+impNorm(it.desc);
    cont[base]=(cont[base]||0)+1;
    it.id='imp_'+cid+'_'+impHash(base+'|'+cont[base]);
  });
  var mapa={};
  state.flanc.forEach(function(l){
    if(!l.categoria||l.tipo==='transferencia'||l.faturaId||l.estornaId)return;
    var k=impNorm(l.descricao);if(!k)return;
    var o=mapa[k]||(mapa[k]={});o[l.categoria]=(o[l.categoria]||0)+1;
  });
  rd.itens.forEach(function(it){
    it.jaImportado=state.flanc.some(function(l){return l.id===it.id});
    var dup=it.jaImportado?null:state.flanc.find(function(l){
      return l.contaId===cid&&!l.importado&&l.tipo!=='transferencia'&&l.estado==='efetivado'&&!finNeutro(l)&&toC(l.valor)===Math.abs(it.c)&&((l.tipo==='receita')===(it.c>0))&&Math.abs(d2n(finDataRef(l))-d2n(it.data))<=2;
    });
    it.dup=dup||null;
    var m=mapa[impNorm(it.desc)],best='',bn=0;
    if(m)Object.keys(m).forEach(function(k){if(m[k]>bn){bn=m[k];best=k}});
    it.cat=best;
  });
  return rd;
}
function contaSemMov(cid){return!state.flanc.some(function(l){return l.estado==='efetivado'&&(l.contaId===cid||l.contaDestinoId===cid)})}
function openImport(){
  var cs=state.fcontas.filter(function(c){return c.ativa!==false}).sort(byNome);
  if(!cs.length){toast('Cadastre uma conta primeiro.');return}
  var body=fld('Conta do extrato','f-conta','<select class="input" id="f-conta" name="f-conta">'+contasOpts(cs[0].id)+'</select>')+
    fld('Arquivo do extrato (.ofx ou .csv)','f-arq','<input class="input" type="file" id="f-arq" name="f-arq" accept=".ofx,.qfx,.csv,.txt,text/csv,application/x-ofx">','O arquivo é lido só neste aparelho. Nada vai para a internet.')+
    '<div class="form-err" id="imp-err" hidden></div><div id="imp-out"></div>';
  var P=null,nomeArq='';
  openModal('Importar extrato',body,{wide:true,submit:'Importar marcadas',onOpen:function(f){
    var out=f.querySelector('#imp-out'),err=f.querySelector('#imp-err');
    function resumo(){
      var sel=0,ent=0,sai=0;
      P.itens.forEach(function(it,i){var k=f.elements['k'+i];if(k&&k.checked){sel++;if(it.c>0)ent+=it.c;else sai+=-it.c}});
      var t='Marcadas: <strong>'+sel+'</strong> · entradas '+money(fromC(ent))+' · saídas '+money(fromC(sai));
      var cid=f.elements['f-conta'].value;
      if(P.saldoC!==null){
        var adj=f.elements['f-ajuste'];
        var novoIni=P.saldoC;P.itens.forEach(function(it,i){var k=f.elements['k'+i];if(k&&k.checked&&it.data<=P.saldoData)novoIni-=it.c});
        P.novoIni=novoIni;
        var depois=(adj&&adj.checked?novoIni:toC((state.fcontas.find(function(x){return x.id===cid})||{}).saldoInicial))+(function(){var s=0;state.flanc.forEach(function(l){if(l.estado!=='efetivado')return;var v=toC(l.valor);if(l.contaId===cid){if(l.tipo==='receita')s+=v;else s-=v}if(l.tipo==='transferencia'&&l.contaDestinoId===cid)s+=v});return s})()+ent-sai;
        t+='<br>Saldo do extrato em '+fmtDate(P.saldoData)+': <strong>'+money(fromC(P.saldoC))+'</strong> · saldo da conta depois de importar: <strong>'+money(fromC(depois))+'</strong>';
      }
      out.querySelector('#imp-sum').innerHTML=t;
    }
    function monta(){
      var cid=f.elements['f-conta'].value;
      if(!P)return;
      impPrepara(P,cid);
      var novas=P.itens.filter(function(i){return!i.jaImportado}).length,ja=P.itens.filter(function(i){return i.jaImportado}).length,dups=P.itens.filter(function(i){return i.dup}).length;
      var conta=state.fcontas.find(function(x){return x.id===cid})||{};

      h+='<div class="sumline" id="imp-sum" style="padding:0 0 8px"></div>';
      if(P.saldoC!==null&&contaSemMov(cid)&&P.itens.length)h+='<label class="chk" for="f-ajuste"><input type="checkbox" id="f-ajuste" name="f-ajuste"'+(toC(conta.saldoInicial)===0?' checked':'')+'> Ajustar o saldo inicial da conta para o saldo do extrato fechar (só vale na primeira importação desta conta)</label>';
      h+='<datalist id="imp-cats">'+cats.map(function(c){return'<option value="'+esc(c)+'">'}).join('')+'</datalist><div class="list-wide" style="max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:8px">';
      P.itens.forEach(function(it,i){

        var tag=it.jaImportado?'<span class="pill mute">Já importada</span>':it.dup?'<span class="pill warn" title="'+esc(it.dup.descricao)+'">Parece já lançada</span>':'';
        h+='<div class="row" style="align-items:center"><label class="chk" style="margin:0"><input type="checkbox" name="k'+i+'" aria-label="Importar '+esc(it.desc)+'"'+(marcado?' checked':'')+(it.jaImportado?' disabled':'')+'></label>'+
          '<div class="r-main"><strong>'+esc(it.desc||'(sem descrição)')+'</strong> '+tag+'<div class="sub">'+fmtDate(it.data)+'</div>'+
          '<input class="input" name="c'+i+'" value="'+esc(it.cat)+'" list="imp-cats" placeholder="Categoria" aria-label="Categoria" style="margin-top:4px;max-width:260px"'+(it.jaImportado?' disabled':'')+'></div>'+
          '<div class="r-amt"><span class="amt'+(it.c>0?' good':' bad')+'">'+(it.c>0?'+ ':'− ')+money(fromC(Math.abs(it.c)))+'</span></div></div>';
      });
      h+='</div><div class="hint" style="padding-top:8px">Conferiu? Cada linha marcada entra como já paga/recebida na data do extrato. Importada não se altera: use Estornar. Transferência entre as suas contas aparece nos dois extratos: marque só um lado.</div>';
      out.innerHTML=h;
      resumo();
    }
    function ler(){
      err.hidden=true;out.innerHTML='';P=null;
      var fl=f.elements['f-arq'].files[0];if(!fl)return;
      nomeArq=fl.name;
      if(fl.size>5*1024*1024){err.textContent='Arquivo grande demais (acima de 5 MB).';err.hidden=false;return}
      var fr=new FileReader();
      fr.onload=function(){
        var rd=impLer(impDecodifica(fr.result));

        if(!rd.itens.length){err.textContent='Não encontrei transações neste arquivo.';err.hidden=false;return}

    var now=Date.now(),lote='l'+now.toString(36),origem=P.formato.toLowerCase(),arq=String(nomeArq).slice(0,80);
    var p=Promise.resolve();

    sel.forEach(function(s,i){

      if(it.fitid)doc.fitid=it.fitid;
      p=p.then(function(){return db.doc('fin_lanc/'+it.id).set(doc)});
    });
    return w(function(){return p}).then(function(){
      window.__OFF.registra('importar','fin_lanc',lote,{arquivo:arq,conta:conta.nome,n:sel.length});
      toast(sel.length+(sel.length===1?' transação importada.':' transações importadas.'));
    });
  }});
}

/* ---------- Retirada do sócio: um movimento, dois lados ligados ---------- */
/* Lado da empresa: despesa «Retirada do sócio» já paga (aparece em Despesas e no Relatório). Lado pessoal: receita na conta que recebeu.
   Os dois nascem de um mesmo código (op). O lado pessoal é gravado primeiro, com tudo que é preciso para refazer o da empresa;
   se algo falhar no meio, a tela avisa e o botão «Completar» termina o serviço sem duplicar. Estornar desfaz os dois lados juntos. */
function retLado(op){
  return{l:state.flanc.find(function(x){return x.id==='ret_'+op}),d:state.despesas.find(function(x){return x.id==='ret_'+op}),p:state.despPag.find(function(x){return x.id==='ret_'+op}),ep:state.despPag.find(function(x){return x.id==='est_ret_'+op}),el:state.flanc.find(function(x){return x.id==='est_ret_'+op})};
}
function retEmpresa(op){
  var s=retLado(op),l=s.l;if(!l)return Promise.resolve();
  var p=Promise.resolve();
  if(!s.d)p=p.then(function(){return db.doc('despesas/ret_'+op).set({descricao:'Retirada do sócio',categoria:'Salários e retiradas',fornecedor:'',valor:l.valor,vencimento:l.data,recorrencia:'unica',fim:'',obs:l.obs||'',criadoEm:l.criadoEm||Date.now(),retiradaId:op})});
  if(!s.p)p=p.then(function(){return db.doc('despPag/ret_'+op).set({despesaId:'ret_'+op,ref:l.data,valor:l.valor,data:l.data,forma:l.forma||'PIX',obs:l.obs||'',criadoEm:l.criadoEm||Date.now(),op:'ret_'+op,retiradaId:op})});
  return p;
}
function retEstornoEmpresa(op,motivo,forcar){
  var s=retLado(op),l=s.l;if(!l||(!l.estornadoPor&&!forcar))return Promise.resolve();
  var p=Promise.resolve();
  var pg=state.despPag.find(function(x){return x.id==='ret_'+op});
  if(!s.ep)p=p.then(function(){return db.doc('despPag/est_ret_'+op).set({despesaId:'ret_'+op,ref:l.data,valor:fromC(-toC(l.valor)),data:(s.el&&s.el.data)||D.t,forma:l.forma||'',obs:'Estorno: '+(motivo||(s.el&&s.el.motivo)||'retirada estornada'),tipo:'estorno',estornaId:'ret_'+op,motivo:motivo||(s.el&&s.el.motivo)||'',criadoEm:Date.now(),op:'est_ret_'+op,retiradaId:op})});
  if(!(pg&&pg.estornadoPor))p=p.then(function(){return db.doc('despPag/ret_'+op).update({estornadoPor:'est_ret_'+op})});
  if(!(s.d&&s.d.cancelada))p=p.then(function(){return db.doc('despesas/ret_'+op).update({cancelada:true})});
  return p;
}
function retPendencias(){
  var out=[];
  state.flanc.forEach(function(l){
    if(!l.retiradaId||l.estornaId)return;
    var op=l.retiradaId,s=retLado(op);
    if(!s.d||!s.p){out.push({op:op,l:l,tipo:'criar'});return}
    if(l.estornadoPor&&(!s.ep||!s.p.estornadoPor||!s.d.cancelada))out.push({op:op,l:l,tipo:'estorno'});
  });
  return out;
}
function retCompletar(op){
  var s=retLado(op);if(!s.l)return;
  w(function(){return retEmpresa(op).then(function(){return retEstornoEmpresa(op)})}).then(function(){toast('Retirada completada: os dois lados estão iguais.')},function(e){toast(e.message)});
}
function openRetirada(){
  var cs=state.fcontas.filter(function(c){return c.ativa!==false}).sort(byNome);
  if(!cs.length){toast('Cadastre uma conta pessoal primeiro.');return}
  var body='<p class="sub" style="margin:0 0 10px">Registra uma vez e lança nos dois lados: despesa «Retirada do sócio» na empresa (já paga) e receita na sua conta pessoal. Os dois ficam ligados.</p>'+
    '<div class="two">'+fld('Valor (R$)','f-val',inp('f-val','','inputmode="decimal" autocomplete="off" placeholder="0,00"'))+fld('Data','f-data',inp('f-data',D.t,'type="date"'))+'</div>'+
    '<div class="two">'+fld('Conta que recebeu','f-conta','<select class="input" id="f-conta" name="f-conta">'+contasOpts(cs[0].id)+'</select>')+
    fld('Forma','f-forma','<select class="input" id="f-forma" name="f-forma"><option>PIX</option><option>Transferência</option><option>Dinheiro</option><option>Outro</option></select>')+'</div>'+
    fld('Observações','f-obs',ta('f-obs',''));
  var op=window.__OFF.newId('r');
  openModal('Retirada do sócio',body,{submit:'Registrar retirada',onSubmit:function(f){
    var v=parseMoney(val(f,'f-val')),d=val(f,'f-data'),conta=val(f,'f-conta');
    if(isNaN(v)||v<=0)fail('Informe um valor maior que zero.');
    if(!d)fail('Informe a data.');
    if(!conta)fail('Escolha a conta.');
    if(state.flanc.some(function(x){return x.id==='ret_'+op}))fail('Esta retirada já foi registrada.');
    var now=Date.now();
    var lanc={tipo:'receita',descricao:'Retirada da empresa',categoria:'Retirada da empresa',contaId:conta,valor:v,data:d,dataEfetiv:d,estado:'efetivado',forma:val(f,'f-forma'),obs:val(f,'f-obs'),parcela:1,total:1,criadoEm:now,efetivadoEm:now,retiradaId:op};
    return w(function(){return db.doc('fin_lanc/ret_'+op).set(lanc).then(function(){return retEmpresa(op)})}).then(function(){toast('Retirada de '+money(v)+' registrada nos dois lados.')});
  }});
}
function estornarRetirada(op){
  var s=retLado(op),l=s.l;if(!l||l.estornadoPor)return;
  confirmMotivo('Estornar retirada do sócio','Desfaz os <strong>dois lados</strong> de '+money(l.valor)+': sai a receita da conta '+esc(finContaNome(l.contaId))+' e a despesa da empresa é estornada. Os originais continuam no histórico.','Estornar',function(motivo){
    var rev='est_ret_'+op;
    var doc={tipo:'despesa',descricao:'Estorno: Retirada da empresa',categoria:'Retirada da empresa',contaId:l.contaId,valor:l.valor,data:D.t,dataEfetiv:D.t,estado:'efetivado',estornaId:l.id,motivo:motivo,retiradaId:op,parcela:1,total:1,criadoEm:Date.now(),efetivadoEm:Date.now()};
    return w(function(){
      return db.doc('fin_lanc/'+rev).set(doc).then(function(){return db.doc('fin_lanc/'+l.id).update({estornadoPor:rev})}).then(function(){return retEstornoEmpresa(op,motivo,true)});
    }).then(function(){toast('Retirada estornada nos dois lados.')});

/* ---------- Fluxo de caixa 30/60/90 dias ---------- */
/* Tudo em centavos inteiros. Ponto de partida: saldo das contas de liquidez (corrente, poupança e carteira; investimento fica fora).
   Entradas e saídas conhecidas: lançamentos ainda previstos (os atrasados entram hoje) e faturas de cartão em aberto, no dia do
   vencimento (parcelas futuras de compras já feitas incluídas). Dia a dia: média diária do que você gastou nos últimos 90 dias
   em despesas avulsas e compras avulsas no cartão (parcelados e repetidos não entram na média, porque já estão como previstos). */
var FLUXO_CEN=[
  {k:'otimista',nome:'Otimista',recF:100,recAtraso:0,gastoF:80,cor:'var(--good)',txt:'receitas na data, gasto do dia a dia 20% menor'},
  {k:'base',nome:'Base',recF:100,recAtraso:7,gastoF:100,cor:'var(--accent)',txt:'receitas com 7 dias de atraso, gasto do dia a dia igual à média'},
  {k:'conservador',nome:'Conservador',recF:70,recAtraso:15,gastoF:125,cor:'var(--bad)',txt:'só 70% das receitas, com 15 dias de atraso, e gasto do dia a dia 25% maior'}
];
function fluxoBase(){
  var hoje=D.t,ev=[],ini=addDays(hoje,-89),primeira=null,soma=0;
  state.flanc.forEach(function(l){
    if(l.estado==='efetivado'||finNeutro(l)||l.tipo==='transferencia')return;
    ev.push({data:l.data<hoje?hoje:l.data,c:(l.tipo==='receita'?1:-1)*toC(l.valor),label:l.descricao||'(sem descrição)',tipo:l.tipo==='receita'?'rec':'des'});
  });
  state.fcartoes.forEach(function(c){
    var por={};
    state.fclanc.forEach(function(l){if(l.cartaoId===c.id)por[l.faturaMes]=(por[l.faturaMes]||0)+ccSinal(l)*toC(l.valor)});
    Object.keys(por).forEach(function(m){
      if(fatPagaDoc(c.id,m)||por[m]<=0)return;
      var d=fatVencData(c,m);
      ev.push({data:d<hoje?hoje:d,c:-por[m],label:'Fatura '+c.nome+' '+mesLabel(fatVencMes(c,m)),tipo:'fat'});
    });
  });
  state.flanc.forEach(function(l){
    if(l.tipo!=='despesa'||l.estado!=='efetivado'||finNeutro(l)||l.faturaId||l.total>1)return;
    var d=finDataRef(l);if(d<ini||d>hoje)return;
    soma+=toC(l.valor);if(!primeira||d<primeira)primeira=d;
  });
  state.fclanc.forEach(function(l){
    if(l.tipo!=='compra'||ccNeutro(l)||l.total>1)return;
    var d=String(l.dataCompra);if(d<ini||d>hoje)return;
    soma+=toC(l.valor);if(!primeira||d<primeira)primeira=d;
  });
  var inicio=primeira;
  state.fcontas.forEach(function(c){if(c.criadoEm){var d=isoDia(c.criadoEm);if(!inicio||d<inicio)inicio=d}});
  state.flanc.forEach(function(l){var d=finDataRef(l);if(d<=hoje&&d>=ini&&(!inicio||d<inicio))inicio=d});
  var dias=inicio?Math.max(1,Math.min(90,d2n(hoje)-d2n(inicio<ini?ini:inicio)+1)):0;
  var saldo=0;
  state.fcontas.forEach(function(c){if(c.tipo!=='investimento')saldo+=finSaldoC(c)});
  return{ev:ev,saldoC:saldo,media:dias?Math.floor(soma/dias):0,dias:dias,gastoTotalC:soma};
}
function fluxoProj(cen,base,H){
  var hoje=D.t,b=[],i;
  for(i=0;i<=H;i++)b.push(0);
  base.ev.forEach(function(e){
    var d=e.tipo==='rec'?addDays(e.data,cen.recAtraso):e.data,idx=d2n(d)-d2n(hoje);
    if(idx<0)idx=0;if(idx>H)return;
    b[idx]+=e.tipo==='rec'?Math.floor(e.c*cen.recF/100):e.c;
  });
  var g=Math.floor(base.media*cen.gastoF/100),out=[base.saldoC+b[0]];
  for(i=1;i<=H;i++)out.push(out[i-1]+b[i]-g);
  return out;
}
function fluxoResumo(serie,H){
  var mn=serie[0],mi=0;
  for(var i=0;i<=H;i++)if(serie[i]<mn){mn=serie[i];mi=i}
  var neg=-1;for(var j=0;j<=H;j++)if(serie[j]<0){neg=j;break}
  return{final:serie[H],min:mn,minData:addDays(D.t,mi),neg:neg,negData:neg>=0?addDays(D.t,neg):''};
}
function fluxoCalc(){
  var base=fluxoBase(),r={base:base,cen:{}};
  FLUXO_CEN.forEach(function(c){
    var s=fluxoProj(c,base,90);
    r.cen[c.k]={serie:s,h30:fluxoResumo(s,30),h60:fluxoResumo(s,60),h90:fluxoResumo(s,90)};
  });
  return r;
}
function fluxoGrafico(r){
  var W=360,Ht=210,L=66,R=10,T=14,B=28,mn=0,mx=0;
  FLUXO_CEN.forEach(function(c){r.cen[c.k].serie.forEach(function(v){if(v<mn)mn=v;if(v>mx)mx=v})});
  if(mx===mn)mx=mn+100;
  var X=function(i){return L+(W-L-R)*i/90},Y=function(v){return T+(Ht-T-B)*(mx-v)/(mx-mn)};
  var lin=FLUXO_CEN.map(function(c){
    var pts=r.cen[c.k].serie.map(function(v,i){return X(i).toFixed(1)+','+Y(v).toFixed(1)}).join(' ');
    return'<polyline fill="none" stroke-width="2.2" stroke-linejoin="round" style="stroke:'+c.cor+'" points="'+pts+'"/>';
  }).join('');
  var zero='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(0).toFixed(1)+'" y2="'+Y(0).toFixed(1)+'" style="stroke:var(--muted)" stroke-dasharray="4 4" stroke-width="1"/>';
  var yl=[mx,0,mn].filter(function(v,i,a){return a.indexOf(v)===i}).map(function(v){return'<text x="'+(L-6)+'" y="'+(Y(v)+4).toFixed(1)+'" text-anchor="end" font-size="11" style="fill:var(--muted)">'+esc(money(fromC(v)).replace('R$ ','R$'))+'</text>'}).join('');
  var xl=[0,30,60,90].map(function(i){return'<text x="'+X(i).toFixed(1)+'" y="'+(Ht-8)+'" text-anchor="'+(i===0?'start':i===90?'end':'middle')+'" font-size="11" style="fill:var(--muted)">'+(i===0?'hoje':fmtShort(addDays(D.t,i)))+'</text>'}).join('');
  return'<svg viewBox="0 0 '+W+' '+Ht+'" width="100%" role="img" aria-label="Saldo projetado para os próximos 90 dias em três cenários" style="max-width:100%;height:auto;display:block">'+zero+lin+yl+xl+'</svg>';
}
function viewFluxo(){
  var r=fluxoCalc(),f=function(c){return money(fromC(c))};
  var rows=FLUXO_CEN.map(function(c){
    var x=r.cen[c.k],cell=function(h){return'<td style="text-align:right;padding:8px 2px 2px;font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums"><strong style="'+(h.final<0?'color:var(--bad)':'')+'">'+f(h.final)+'</strong></td>'};
    return'<tbody data-cen="'+c.k+'" style="border-top:1px solid var(--line)"><tr><td style="padding:8px 2px 2px;font-size:13px"><span aria-hidden="true" style="display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;background:'+c.cor+'"></span><strong>'+c.nome+'</strong></td>'+cell(x.h30)+cell(x.h60)+cell(x.h90)+'</tr><tr><td colspan="4" class="sub" style="padding:0 4px 8px;font-size:12px;'+(x.h90.min<0?'color:var(--bad)':'')+'">Menor saldo em 90 dias: '+f(x.h90.min)+' em '+fmtShort(x.h90.minData)+'</td></tr></tbody>';
  }).join('');
  var alertas=FLUXO_CEN.filter(function(c){return r.cen[c.k].h90.neg>=0}).map(function(c){var x=r.cen[c.k].h90;return'<div class="notice" style="margin-bottom:8px"><span><strong>Cenário '+c.nome.toLowerCase()+':</strong> o saldo fica negativo a partir de '+fmtDate(x.negData)+' e chega a '+f(x.min)+' em '+fmtDate(x.minData)+'.</span></div>'}).join('');
  var prox=r.base.ev.filter(function(e){return e.data<=addDays(D.t,30)}).sort(function(a,b){return a.data<b.data?-1:a.data>b.data?1:a.c-b.c}).slice(0,15);
  var lista=prox.length?prox.map(function(e){return'<div class="row"><div class="r-main"><strong>'+esc(e.label)+'</strong><div class="sub">'+fmtDate(e.data)+' · '+(e.tipo==='rec'?'receita prevista':e.tipo==='fat'?'fatura do cartão':'despesa prevista')+'</div></div><div class="r-amt"><span class="amt'+(e.c>0?' good':' bad')+'">'+(e.c>0?'+ ':'− ')+f(Math.abs(e.c))+'</span></div></div>'}).join(''):'<div class="row"><div class="r-main muted">Nada previsto nos próximos 30 dias. Lance contas a pagar e a receber, ou cadastre cartões, para a projeção ficar útil.</div></div>';
  var pouco=r.base.dias<30?'<div class="notice info" style="margin:0 16px 10px"><span>Ainda há pouco histórico ('+r.base.dias+(r.base.dias===1?' dia':' dias')+'): a estimativa do gasto do dia a dia é fraca. Ela melhora conforme você lança ou importa o extrato.</span></div>':'';
  var como='<ul style="margin:0;padding:0 16px 14px 32px;line-height:1.6" class="sub"><li>Começa com o saldo das contas de liquidez hoje: <strong>'+f(r.base.saldoC)+'</strong> (investimentos ficam de fora).</li>'+

/* ---------- PIN das finanças pessoais ---------- */
/* O PIN esconde a tela de Minhas finanças (trava ao ficar parado e quando o app volta do fundo). Ele NÃO criptografa os dados:
   quem tem acesso ao aparelho destravado e sabe usar as ferramentas do navegador ainda alcança os dados. A criptografia é uma etapa à parte.
   O PIN é guardado só como resumo (PBKDF2 com sal). Esquecido, não há como recuperar: redefine-se com a senha de login. */
var finDesbloq=false,finAtiv=Date.now(),finOculto=0;
function finTmo(){return(window.__OFF&&window.__OFF.finTrancaMs)||300000}
function finPinDoc(){return state.fconf.find(function(x){return x.id==='pin'&&x.hash})||null}
function finPinEstado(){return state.fconf.find(function(x){return x.id==='pin_estado'})||{falhas:0,ate:0}}
function finTrancado(){
  if(!finPinDoc())return false;
  if(finDesbloq&&Date.now()-finAtiv>finTmo())finDesbloq=false;
  return!finDesbloq;
}
function finTrancar(){finDesbloq=false;if(!modalEl.hidden)closeModal();render()}
function pinOk(p){return/^\d{4,8}$/.test(p)}
function pinFraco(p){return/^(\d)\1+$/.test(p)||'0123456789'.indexOf(p)>=0||'9876543210'.indexOf(p)>=0}
function pinSalvar(pin){
  var salt=window.__OFF.novoSalt();
  return window.__OFF.pinHash(pin,salt).then(function(h){return db.doc('fin_config/pin').set({salt:salt,hash:h,alg:'p2',criadoEm:Date.now()})}).then(function(){return db.doc('fin_config/pin_estado').set({falhas:0,ate:0})});
}
function pinConfere(pin){
  var d=finPinDoc(),e=finPinEstado();
  if(!d)return Promise.resolve(true);
  if(e.ate&&Date.now()<e.ate)return Promise.reject(new Error('Muitas tentativas. Aguarde '+Math.ceil((e.ate-Date.now())/1000)+' segundos.'));
  return window.__OFF.pinHash(pin,d.salt).then(function(h){
    if(h===d.hash)return db.doc('fin_config/pin_estado').set({falhas:0,ate:0}).then(function(){return true});
    var fa=(Number(e.falhas)||0)+1,ate=0;
    if(fa%5===0)ate=Date.now()+Math.min(900,30*Math.pow(2,fa/5-1))*1000;
    return db.doc('fin_config/pin_estado').set({falhas:fa,ate:ate}).then(function(){throw new Error(ate?'PIN incorreto. Muitas tentativas: aguarde '+Math.round((ate-Date.now())/1000)+' segundos.':'PIN incorreto. Restam '+(5-fa%5)+' tentativas antes de bloquear por um tempo.')});
  });
}
function openPinEntrada(){
  var body=fld('PIN das finanças','f-pin','<input class="input" type="password" id="f-pin" name="f-pin" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="4 a 8 números">');
  openModal('Minhas finanças trancada',body,{submit:'Destrancar',left:'<button type="button" class="btn" data-act="pin-esqueci">Esqueci o PIN</button>',onSubmit:function(f){
    var p=val(f,'f-pin');if(!pinOk(p))fail('Digite o PIN (4 a 8 números).');
    return w(function(){return pinConfere(p)}).then(function(){finDesbloq=true;finAtiv=Date.now();render()});
  }});
}
function openPinMenu(){
  var d=finPinDoc();
  if(!d){openPinNovo(false);return}
  var b=function(act,t,cls){return'<button type="button" class="btn'+(cls?' '+cls:'')+'" data-act="'+act+'" style="width:100%;margin-bottom:8px">'+t+'</button>'};
  openModal('PIN das finanças',b('pin-trancar','Trancar agora','primary')+b('pin-mudar','Mudar o PIN')+b('pin-remover','Remover o PIN','danger')+'<p class="hint">O PIN esconde a tela de Minhas finanças e tranca sozinho depois de alguns minutos sem uso. Ele não criptografa os dados.</p>',{submit:null});
}
function openPinNovo(trocando,esqueci){
  var body=(esqueci?fld('Sua senha de login','f-senha','<input class="input" type="password" id="f-senha" name="f-senha" autocomplete="current-password">','O PIN esquecido não se recupera por backup. Para criar outro, confirme sua senha de login.'):trocando?fld('PIN atual','f-atual','<input class="input" type="password" id="f-atual" name="f-atual" inputmode="numeric" autocomplete="off" maxlength="8">'):'<p class="sub" style="margin:0 0 10px">O PIN esconde a tela de Minhas finanças. Ele <strong>não criptografa</strong> os dados e <strong>não pode ser recuperado</strong> se você esquecer (só redefinido com a senha de login).</p>')+
    '<div class="two">'+fld('Novo PIN','f-n1','<input class="input" type="password" id="f-n1" name="f-n1" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="4 a 8 números">')+fld('Repita o PIN','f-n2','<input class="input" type="password" id="f-n2" name="f-n2" inputmode="numeric" autocomplete="off" maxlength="8">')+'</div>';
  openModal(esqueci?'Redefinir o PIN':trocando?'Mudar o PIN':'Proteger com PIN',body,{submit:'Salvar PIN',onSubmit:function(f){
    var n1=val(f,'f-n1'),n2=val(f,'f-n2');
    if(!pinOk(n1))fail('O PIN deve ter de 4 a 8 números.');
    if(pinFraco(n1))fail('PIN fácil demais (como 0000 ou 1234). Escolha outro.');
    if(n1!==n2)fail('Os dois PINs não são iguais.');
    var passo=Promise.resolve();
    if(esqueci)passo=window.__OFF.confereSenhaLogin(f.elements['f-senha'].value).then(function(ok){if(!ok)throw new Error('Senha de login incorreta.')});
    else if(trocando)passo=pinConfere(val(f,'f-atual'));
    return w(function(){return passo.then(function(){return pinSalvar(n1)})}).then(function(){
      finDesbloq=true;finAtiv=Date.now();
      window.__OFF.registra(esqueci?'pin-redefinir':trocando?'pin-mudar':'pin-definir','fin_config','pin',{});
      toast('PIN salvo.');
    });
  }});
}
function openPinRemover(){
  var body='<p class="sub" style="margin:0 0 10px">Sem PIN, qualquer pessoa que abrir o app como administrador vê Minhas finanças.</p>'+fld('PIN atual','f-atual','<input class="input" type="password" id="f-atual" name="f-atual" inputmode="numeric" autocomplete="off" maxlength="8">');
  openModal('Remover o PIN',body,{submit:'Remover',danger:true,onSubmit:function(f){
    return w(function(){return pinConfere(val(f,'f-atual')).then(function(){return db.doc('fin_config/pin').set({removido:true,em:Date.now()})})}).then(function(){
      finDesbloq=false;window.__OFF.registra('pin-remover','fin_config','pin',{});toast('PIN removido.');
    });
  }});
}

/* ----- rentabilidade (tudo em centavos inteiros) ----- */
function eqPeriodo(p){var t=todayStr();return p==='90'?{de:addDays(t,-89),ate:t}:p==='ano'?{de:t.slice(0,4)+'-01-01',ate:t}:{de:'',ate:''}}
function eqNoPer(d,per){d=String(d||'').slice(0,10);return!per.de||(d>=per.de&&d<=per.ate)}
function eqFimAl(a,t){
  if(a.status==='encerrado')return a.devolucao||a.encerradoEm||a.fim||a.inicio;
  return t>a.inicio?t:a.inicio;
}
function eqDiasAl(a,per,t){
  var s=a.inicio,e=eqFimAl(a,t);if(!s||!e)return 0;
  var win=!!per.de;
  if(win){if(s<per.de)s=per.de;if(e>per.ate)e=per.ate}
  var d=d2n(e)-d2n(s);
  if(d<=0)return(!win&&e===s)?1:0;
  return d;
}
function eqRent(it,per){
  var t=todayStr(),als=state.alugueis.filter(function(a){return a.itemId===it.id});
  var ids={};als.forEach(function(a){ids[a.id]=1});
  var rec=0;
  state.pagamentos.forEach(function(p){if(ids[p.aluguelId]&&eqNoPer(p.data,per))rec+=toC(p.valor)});
  var man=0;
  state.manut.forEach(function(m){if(m.itemId===it.id&&!m.cancelada&&eqNoPer(m.data,per))man+=toC(m.custo)});
  var dids={};state.despesas.forEach(function(d){if(d.itemId===it.id&&!d.cancelada)dids[d.id]=1});
  var dsp=0;
  state.despPag.forEach(function(p){if(dids[p.despesaId]&&eqNoPer(p.data,per))dsp+=toC(p.valor)});
  var dias=0;als.forEach(function(a){dias+=eqDiasAl(a,per,t)});
  /* ocupação: dias alugados / dias do período (para "tudo": desde a compra ou o 1º aluguel) */
  var ini=per.de,fim=per.ate||t;
  if(!ini){
    var c=[];if(it.dataCompra)c.push(it.dataCompra);als.forEach(function(a){if(a.inicio)c.push(a.inicio)});
    c.sort();ini=c[0]||'';
  }
  var span=ini?Math.max(1,d2n(fim)-d2n(ini)+1):0;
  var ocup=span&&it.tipo!=='assinatura'?Math.min(1000,Math.round(dias*1000/span)):null;
  var compra=toC(it.valorCompra),res=rec-man-dsp;
  return{it:it,rec:rec,man:man,dsp:dsp,res:res,dias:dias,ocup:ocup,compra:compra,
    roi:compra>0&&!per.de?Math.round(res*1000/compra):null,falta:compra>0&&!per.de?Math.max(0,compra-res):null,n:als.length};
}
function pct10(n){return n==null?'—':(n/10).toFixed(1).replace('.',',')+'%'}
function eqPorMes(it){ /* resultado médio mensal dos últimos 90 dias, para estimar o retorno */
  var r=eqRent(it,eqPeriodo('90'));return Math.round(r.res/3);
}
function viewRent(){
  var p=ui.erp||'tudo',per=eqPeriodo(p);
  var rows=eqItens().map(function(i){return eqRent(i,per)});
  rows.sort(function(a,b){return b.res-a.res||String(a.it.nome).localeCompare(String(b.it.nome),'pt-BR')});
  var tot={rec:0,man:0,dsp:0,res:0};rows.forEach(function(r){tot.rec+=r.rec;tot.man+=r.man;tot.dsp+=r.dsp;tot.res+=r.res});
  var chips=[['tudo','Desde o início'],['ano','Este ano'],['90','Últimos 90 dias']];
  var bar='<div class="toolbar"><div class="chips">'+chips.map(function(c){return'<button type="button" class="chip" aria-pressed="'+(p===c[0])+'" data-act="erp" data-v="'+c[0]+'">'+c[1]+'</button>'}).join('')+'</div></div>';
  var sum='<div class="sumline" id="rent-total">Recebido '+mC(tot.rec)+' · Manutenção '+mC(tot.man)+' · Despesas ligadas '+mC(tot.dsp)+' · <strong>Resultado '+mC(tot.res)+'</strong></div>';
  var body=rows.length?rows.map(function(r){
    var pill=r.res>0?'<span class="pill good">Lucro</span>':r.res<0?'<span class="pill bad">Prejuízo</span>':'<span class="pill mute">Sem resultado</span>';
    var extra=[];
    if(r.ocup!=null)extra.push('ocupação '+pct10(r.ocup));
    if(r.roi!=null)extra.push('retorno '+pct10(r.roi)+' do investimento');
    return'<div class="row" data-eq="'+esc(r.it.id)+'"><div class="r-main"><button type="button" class="link" data-act="eq-det" data-id="'+esc(r.it.id)+'">'+esc(r.it.nome)+'</button><div class="sub">Recebido '+mC(r.rec)+' · Manutenção '+mC(r.man)+(r.dsp?' · Despesas '+mC(r.dsp):'')+(extra.length?' · '+extra.join(' · '):'')+'</div></div><div class="r-amt"><span class="amt" data-res="'+r.res+'">'+mC(r.res)+'</span>'+pill+'</div></div>';
  }).join(''):'<div class="empty"><p>Nenhum equipamento cadastrado ainda.</p></div>';
  var nota='<div class="hint" style="padding:8px 16px">Resultado = pagamentos recebidos (já com estornos) − custos de manutenção − despesas ligadas ao equipamento. Informe o valor de compra no cadastro do item para ver o retorno do investimento.</div>';
  return bar+sum+'<section class="panel list-wide">'+body+'</section>'+nota;
}
function openEqDetalhe(id){
  var it=state.itens.find(function(x){return x.id===id});if(!it)return;
  var r=eqRent(it,eqPeriodo('tudo')),r90=eqRent(it,eqPeriodo('90'));

  kv+='<dt>Dias alugado</dt><dd>'+r.dias+(r.ocup!=null?' · ocupação '+pct10(r.ocup):'')+'</dd>';
  if(r.compra>0){
    kv+='<dt>Valor de compra</dt><dd>'+mC(r.compra)+(it.dataCompra?' em '+fmtDate(it.dataCompra):'')+'</dd><dt>Retorno</dt><dd id="d-roi">'+pct10(r.roi)+'</dd>';
    if(r.falta===0)kv+='<dt>Investimento</dt><dd><span class="pill good">Recuperado</span></dd>';
    else{
      var m=eqPorMes(it);
      kv+='<dt>Falta recuperar</dt><dd id="d-falta">'+mC(r.falta)+'</dd><dt>Estimativa</dt><dd>'+(m>0?'cerca de '+Math.ceil(r.falta/m)+' meses no ritmo dos últimos 90 dias ('+mC(m)+'/mês). É uma estimativa.':'sem estimativa: os últimos 90 dias não deram resultado positivo.')+'</dd>';
    }
  }else kv+='<dt>Valor de compra</dt><dd class="muted">Não informado. Edite o item para ver o retorno.</dd>';

function eqConflitoRes(itemId,ini,fim,ignoreRes){
  var c=state.reservas.filter(function(r){return r.itemId===itemId&&r.status==='ativa'&&r.id!==ignoreRes&&r.inicio<=fim&&r.fim>=ini})[0];
  return c?'Já existe reserva de '+eqCliNome(c.clienteId)+' para este equipamento de '+fmtDate(c.inicio)+' a '+fmtDate(c.fim)+'.':'';
}
function eqConflitoAl(itemId,ini,fim){
  var t=todayStr();
  var c=state.alugueis.filter(function(a){
    if(a.itemId!==itemId||a.status==='encerrado')return false;
    if(a.modalidade==='mes')return true;
    var fimA=a.fim||a.inicio;if(fimA<t)fimA=t;
    return a.inicio<=fim&&fimA>=ini;
  })[0];
  return c?'O equipamento está alugado para '+eqCliNome(c.clienteId)+(c.modalidade==='mes'?' (aluguel mensal sem data de fim)':' até '+fmtDate(c.fim||c.inicio))+'.':'';

function cancelarReserva(id){
  var r=state.reservas.find(function(x){return x.id===id});if(!r||r.status!=='ativa')return;
  confirmMotivo('Cancelar reserva','A reserva de <strong>'+esc(eqCliNome(r.clienteId))+'</strong> fica no histórico como cancelada e o equipamento volta a ficar livre nessas datas.','Cancelar reserva',function(motivo){
    return w(function(){return db.doc('reservas/'+id).update({status:'cancelada',motivo:motivo,canceladaEm:todayStr()})}).then(function(){toast('Reserva cancelada.')});
  });
}
function converterReserva(id){
  var r=state.reservas.find(function(x){return x.id===id});if(!r||r.status!=='ativa')return;
  var it=state.itens.find(function(x){return x.id===r.itemId});
  openAluguel(null,{clienteId:r.clienteId,itemId:r.itemId,modalidade:'dia',inicio:r.inicio,fim:r.fim,valorUnit:r.valorUnit||(it&&it.valorDia)||0,reservaId:r.id});
}

/* ---------- Risco do cliente (explicável, só aconselha: nunca bloqueia) ---------- */
var RISCO_NIVEL={baixo:['Baixo','good'],medio:['Médio','warn'],alto:['Alto','bad'],sem:['Sem histórico','mute']};
function riscoDiasPago(a,r){
  var ps=state.pagamentos.filter(function(p){return p.aluguelId===a.id&&p.ref===r.ref&&p.tipo!=='estorno'&&!p.estornadoPor&&Number(p.valor)>0});
  if(!ps.length)return null;
  var d=ps.reduce(function(m,p){return String(p.data)>m?String(p.data):m},'');
  return Math.max(0,d2n(d)-d2n(r.venc));
}
function riscoCliente(cid){
  var t=D.t,als=state.alugueis.filter(function(a){return a.clienteId===cid&&a.inicio}),F=[];
  var rows=[];als.forEach(function(a){(D.byAl[a.id]||[]).forEach(function(r){if(r.venc<=t)rows.push({a:a,r:r})})});
  var amostra=rows.length;
  var atr=rows.filter(function(x){return x.r.status==='atrasado'});
  var maxAtr=0,saldoAtr=0;atr.forEach(function(x){maxAtr=Math.max(maxAtr,-x.r.delta);saldoAtr+=toC(x.r.total)});
  if(atr.length)F.push({t:'Em atraso hoje: '+atr.length+(atr.length===1?' cobrança':' cobranças')+', '+mC(saldoAtr)+', até '+maxAtr+(maxAtr===1?' dia':' dias')+' de atraso',p:maxAtr>30?50:maxAtr>7?35:20});
  var pagas=0,tarde=0,pont=0,maxPago=0;
  rows.forEach(function(x){
    if(x.r.status!=='pago')return;
    var d=riscoDiasPago(x.a,x.r);if(d===null)return;
    pagas++;if(d>0)tarde++;else pont++;maxPago=Math.max(maxPago,d);
  });
  if(tarde>0){
    var pc=tarde*100/pagas;
    F.push({t:tarde+' de '+pagas+(pagas===1?' cobrança paga':' cobranças pagas')+' com atraso ('+Math.round(pc)+'%)',p:pc>=50?25:pc>=25?15:5});
    if(maxPago>15)F.push({t:'Maior atraso já pago: '+maxPago+' dias',p:10});
  }
  var dv=0;
  als.forEach(function(a){
    if(a.modalidade==='mes')return;
    var fim=a.fim||a.inicio;
    if(a.devolucao){if(d2n(a.devolucao)-d2n(fim)>2)dv++}
    else if(a.status!=='encerrado'&&d2n(t)-d2n(fim)>2)dv++;
  });
  if(dv>0)F.push({t:'Devolução atrasada em '+dv+(dv===1?' aluguel':' aluguéis')+' (mais de 2 dias)',p:Math.min(15,dv*5)});
  var dn=state.vist.filter(function(v){return v.clienteId===cid&&v.tipo==='devolucao'&&!v.retificadaPor&&(v.condicao==='ruim'||v.condicao==='danificado')}).length;
  if(dn>0)F.push({t:'Equipamento devolvido ruim ou danificado em '+dn+(dn===1?' vistoria':' vistorias'),p:Math.min(30,dn*15)});
  if(pont>=3&&!tarde&&!atr.length&&!dv&&!dn)F.push({t:pont+' cobranças pagas em dia, sem nenhum atraso',p:-10});
  var pts=Math.max(0,Math.min(100,F.reduce(function(s,f){return s+f.p},0)));
  var nivel=(amostra<2&&!atr.length&&!dn)?'sem':pts>=40?'alto':pts>=15?'medio':'baixo';
  return{pts:pts,nivel:nivel,fatores:F,amostra:amostra};
}
function pillRisco(r){var n=RISCO_NIVEL[r.nivel];return'<span class="pill '+n[1]+'" data-risco="'+r.nivel+'">'+(r.nivel==='sem'?n[0]:'Risco '+n[0].toLowerCase())+'</span>'}
function riscoPainel(cid){
  var r=riscoCliente(cid);
  var h='<div class="h3" style="margin-top:14px">Risco do cliente</div><div id="risco-painel" class="sub" style="margin-bottom:6px">'+pillRisco(r)+' <span class="muted">'+r.pts+' de 100 pontos · base: '+r.amostra+(r.amostra===1?' cobrança vencida':' cobranças vencidas')+'</span></div>';
  h+=r.fatores.length?'<ul style="margin:0 0 8px;padding-left:18px">'+r.fatores.map(function(f){return'<li>'+esc(f.t)+' <span class="muted">('+(f.p>0?'+':'')+f.p+')</span></li>'}).join('')+'</ul>':'<div class="sub" style="margin-bottom:8px">Nenhum ponto de atenção no histórico.</div>';
  h+='<div class="hint">Só usa o histórico deste sistema (pagamentos, devoluções e vistorias). É um conselho, não uma decisão: nada é bloqueado. Com menos de 2 cobranças vencidas, não há base para classificar. Baixo: até 14 pontos · Médio: 15 a 39 · Alto: 40 ou mais.</div>';
  return h;
}
function riscoLinha(cid){
  if(!cid)return'';
  var r=riscoCliente(cid);
  if(r.nivel==='baixo'||r.nivel==='sem')return r.nivel==='sem'?'<span class="muted">Cliente sem histórico suficiente para avaliar o risco.</span>':'';
  return pillRisco(r)+' '+esc(r.fatores.filter(function(f){return f.p>0}).map(function(f){return f.t}).join('; '))+'. <span class="muted">É só um aviso, você decide.</span>';
}

/* ---------- Cobrar hoje ---------- */
/* Cada cobrança tem, por dia, um registro de contato com estados separados: preparada, WhatsApp aberto e envio confirmado.
   Só o próprio usuário confirma o envio: abrir o WhatsApp não prova que a mensagem foi mandada. */
var CT_ROT={nenhum:'Não contatado hoje',preparada:'Mensagem preparada, falta enviar',aberta:'WhatsApp aberto, falta confirmar o envio',enviada:'Envio confirmado'};
var CT_CANAL={whatsapp:'WhatsApp',ligacao:'Ligação',pessoalmente:'Pessoalmente'};
function ctId(r){return'c_'+r.a.id+'_'+r.ref+'_'+D.t.replace(/-/g,'')}
function ctDe(r){return D.ct[ctId(r)]||null}
function ctEstado(c){return!c?'nenhum':c.enviadoEm?'enviada':c.abertoEm?'aberta':'preparada'}
function ctHora(ms){return fmtDH(ms).slice(11)}
function ctPill(c){
  var e=ctEstado(c),t=CT_ROT[e];
  if(e==='enviada')t+=' às '+ctHora(c.enviadoEm)+(c.canal&&c.canal!=='whatsapp'?' ('+(CT_CANAL[c.canal]||c.canal).toLowerCase()+')':'');
  return'<span class="pill '+{nenhum:'mute',preparada:'warn',aberta:'warn',enviada:'good'}[e]+'">'+esc(t)+'</span>';
}
function pixCodigoDe(r,valorC){return pixPayload({chave:pixChaveNorm(cfg.pixTipo,cfg.pixChave).chave,nome:pixAscii(cfg.pixNome||cfg.empresaNome,25),cidade:pixAscii(cfg.pixCidade||cfg.cidade,15),valorC:valorC,txid:pixTxid(r)})}
function ctSalvar(r,patch){
  var id=ctId(r),ex=ctDe(r),now=Date.now();
  var base=ex?Object.assign({},ex):{aluguelId:r.a.id,ref:r.ref,dia:D.t,clienteId:r.a.clienteId,valor:r.total,criadoEm:now};
  delete base.id;
  var doc=Object.assign(base,patch,{atualizadoEm:now});
  if(r.a.exemplo)doc.exemplo=true;
  D.ct[id]=Object.assign({id:id},doc);   /* a tela já vê o novo estado; o banco confirma em seguida */
  return w(function(){return db.doc('contatos/'+id).set(doc)});
}
function hojeRow(r){
  var a=r.a,c=D.cli[a.clienteId],ct=ctDe(r),e=ctEstado(ct);
  var sub=esc(nomeItem(a.itemId))+' · '+esc(whatText(r))+(r.pago>0?' · já pago '+money(r.pago):'')+(r.enc>0?' · com multa e juros de '+money(r.enc):'')+(c&&c.telefone?' · '+esc(c.telefone):' · <span class="muted">sem telefone</span>');
  var bt=function(act,label,cls){return'<button type="button" class="btn sm'+(cls?' '+cls:'')+'" data-act="'+act+'" data-id="'+esc(a.id)+'" data-ref="'+esc(r.ref)+'">'+label+'</button>'};
  var acts='';
  if(canWrite){
    acts+=bt('hoje-msg',e==='nenhum'?'Preparar mensagem':'Abrir mensagem',e==='nenhum'?'primary':'');
    if(e==='preparada'||e==='aberta')acts+=bt('hoje-conf','Confirmar que enviei','primary');
    acts+=bt('receber','Receber');
  }
  acts+=bt('pix','Pix');
  return'<div class="row"><div class="r-main"><button type="button" class="link" data-act="abrir-al" data-id="'+esc(a.id)+'">'+esc(nomeCli(a.clienteId))+'</button><div class="sub">'+sub+'</div><div style="margin-top:4px">'+ctPill(ct)+'</div></div>'+
    '<div class="r-amt"><span class="amt">'+money(r.total)+'</span>'+pillCob(r)+'</div><div class="r-act">'+acts+'</div></div>';
}
function viewHoje(){
  var all=D.hoje,f=ui.hoje||'todas',st=function(r){return ctEstado(ctDe(r))};
  var fn={todas:function(){return true},nenhum:function(r){return st(r)==='nenhum'},falta:function(r){var e=st(r);return e==='preparada'||e==='aberta'},enviada:function(r){return st(r)==='enviada'}};
  var chips=[['todas','Todas'],['nenhum','Não contatadas'],['falta','Falta confirmar'],['enviada','Envio confirmado']].map(function(c){return[c[0],c[1],all.filter(fn[c[0]]).length]});
  var bar='<div class="toolbar"><div class="chips">'+chips.map(function(c){return'<button type="button" class="chip" aria-pressed="'+(f===c[0])+'" data-act="filtro-hoje" data-v="'+c[0]+'">'+c[1]+'<span class="n">'+c[2]+'</span></button>'}).join('')+'</div></div>';
  var list=all.filter(fn[f]);
  var body='<div class="sumline" style="padding-top:12px">'+list.length+(list.length===1?' cobrança':' cobranças')+' · '+money(sumBy(list,function(r){return r.total}))+'</div>'+
    (list.length?list.map(hojeRow).join(''):'<div class="row"><div class="r-main muted">'+(all.length?'Nenhuma cobrança neste filtro.':'Nada para cobrar hoje. Nenhuma cobrança atrasada ou vencendo hoje.')+'</div></div>')+
    '<div class="hint" style="padding:10px 16px 14px">Entram aqui as cobranças atrasadas e as que vencem hoje. Abrir o WhatsApp não conta como enviado: só vale quando você toca em “Confirmar que enviei”.</div>';
  return bar+'<section class="panel list-wide">'+body+'</section>';
}
function openCobrar(id,ref){
  var r=(D.byAl[id]||[]).find(function(x){return x.ref===ref});if(!r){toast('Cobrança não encontrada.');return}
  var c=D.cli[r.a.clienteId]||{},ct=ctDe(r)||{};
  var pix=pixOk(),pixC=toC(r.total),marca='\n\nPix copia e cola:\n';
  var body='<p class="sub" style="margin:0 0 10px">'+esc(nomeCli(r.a.clienteId))+' · '+esc(nomeItem(r.a.itemId))+' · '+esc(whatText(r))+' · '+money(r.total)+'</p>'+
    fld('Como você vai cobrar','f-canal','<select class="input" id="f-canal" name="f-canal">'+Object.keys(CT_CANAL).map(function(k){return'<option value="'+k+'"'+((ct.canal||'whatsapp')===k?' selected':'')+'>'+CT_CANAL[k]+'</option>'}).join('')+'</select>')+
    (pix?'<label class="chk" for="f-pixinc"><input type="checkbox" id="f-pixinc" name="f-pixinc"'+(ct.msg&&ct.msg.indexOf(marca)>=0?' checked':'')+'> Incluir Pix copia e cola na mensagem</label>':'')+
    fld('Mensagem','f-msg',ta('f-msg','').replace('rows="2"','rows="8"'))+
    '<div class="notice info" id="ct-st" style="margin-top:8px"></div>';
  var b=function(act,label,cls){return'<button type="button" class="btn'+(cls?' '+cls:'')+'" data-act="'+act+'" data-id="'+esc(id)+'" data-ref="'+esc(ref)+'">'+label+'</button>'};
  openModal('Cobrar '+(c.nome||'cliente'),body,{submit:null,wide:true,left:b('hoje-prep','Salvar como preparada')+b('hoje-wa','Abrir no WhatsApp')+b('hoje-conf2','Confirmar que enviei','primary'),onOpen:function(f){
    var ta=f.elements['f-msg'];ta.value=ct.msg||waMsg(r);
    function st(){var e=ctEstado(ctDe(r));f.querySelector('#ct-st').textContent=CT_ROT[e]+(e==='enviada'?' às '+ctHora(ctDe(r).enviadoEm):'')+'. '+(e==='nenhum'?'Nada foi enviado ainda.':e==='enviada'?'':'O envio só conta quando você confirmar.')}
    function canal(){var w=f.elements['f-canal'].value==='whatsapp';var bw=modalEl.querySelector('[data-act=hoje-wa]');bw.disabled=!w||!waHref(c,'x');bw.title=!waHref(c,'x')?'Cliente sem telefone cadastrado':''}
    f.elements['f-canal'].addEventListener('change',canal);
    var px=f.elements['f-pixinc'];
    if(px)px.addEventListener('change',function(){
      var i=ta.value.indexOf(marca);if(i>=0)ta.value=ta.value.slice(0,i);
      if(px.checked)ta.value+=marca+pixCodigoDe(r,pixC);
    });
    canal();st();window.__ctSt=st;
  }});
}
function ctForm(){var f=document.getElementById('mform');return{msg:f.elements['f-msg'].value,canal:f.elements['f-canal'].value,quem:window.__OFF.quem()}}
function ctPatchBase(r,fm){var ex=ctDe(r)||{};return{msg:fm.msg,canal:fm.canal,preparadoEm:ex.preparadoEm||Date.now(),preparadoPor:ex.preparadoPor||fm.quem}}
function ctPrep(id,ref){
  var r=(D.byAl[id]||[]).find(function(x){return x.ref===ref});if(!r)return;
  ctSalvar(r,ctPatchBase(r,ctForm())).then(function(){toast('Mensagem preparada. Ainda não foi enviada.');if(window.__ctSt)window.__ctSt()},function(e){toast(e.message)});
}
function ctAbrirWa(id,ref){
  var r=(D.byAl[id]||[]).find(function(x){return x.ref===ref});if(!r)return;
  var fm=ctForm(),c=D.cli[r.a.clienteId]||{},h=waHref(c,fm.msg);
  if(!h){toast('Cliente sem telefone cadastrado.');return}
  var ex=ctDe(r)||{};
  ctSalvar(r,Object.assign(ctPatchBase(r,fm),{canal:'whatsapp',abertoEm:ex.abertoEm||Date.now()})).then(function(){
    var a=document.createElement('a');a.href=h;a.target='_blank';a.rel='noopener';a.style.display='none';document.body.appendChild(a);a.click();setTimeout(function(){a.remove()},500);
    toast('WhatsApp aberto. Depois de enviar, volte e confirme.');if(window.__ctSt)window.__ctSt();
  },function(e){toast(e.message)});
}
function ctConfirmar(id,ref,fromModal){
  var r=(D.byAl[id]||[]).find(function(x){return x.ref===ref});if(!r)return;
  var ex=ctDe(r)||{},fm=fromModal?ctForm():{msg:ex.msg||waMsg(r),canal:ex.canal||'whatsapp',quem:window.__OFF.quem()};
  ctSalvar(r,Object.assign(ctPatchBase(r,fm),{enviadoEm:ex.enviadoEm||Date.now(),enviadoPor:ex.enviadoPor||fm.quem})).then(function(){toast('Envio confirmado.');if(fromModal)closeModal()},function(e){toast(e.message)});
}
function ctHist(id){
  var l=state.contatos.filter(function(x){return x.aluguelId===id}).sort(function(a,b){return(b.criadoEm||0)-(a.criadoEm||0)});
  if(!l.length)return'';
  return'<div class="h3">Contatos de cobrança</div><div class="mini">'+l.map(function(x){
    var e=ctEstado(x);
    return'<div class="row"><div class="r-main">'+esc(fmtDate(x.dia))+' · '+esc(x.ref==='total'?'cobrança':x.ref.length===7?'mensalidade '+x.ref.slice(5)+'/'+x.ref.slice(0,4):x.ref)+'<div class="sub">'+esc(CT_ROT[e])+(x.canal?' · '+esc(CT_CANAL[x.canal]||x.canal):'')+(x.enviadoPor||x.preparadoPor?' · '+esc(x.enviadoPor||x.preparadoPor):'')+'</div></div></div>';
  }).join('')+'</div>';
}

/* ---------- recibos ---------- */
function fmtDH(ms){var d=new Date(ms);function z(n){return String(n).padStart(2,'0')}return z(d.getDate())+'/'+z(d.getMonth()+1)+'/'+d.getFullYear()+' '+z(d.getHours())+':'+z(d.getMinutes())}
function reciboDe(pagId){return state.recibos.find(function(x){return x.id==='r_'+pagId})||null}
function reciboDup(rec){return state.recibos.some(function(x){return x.id!==rec.id&&x.numero===rec.numero})}
function reciboDados(p,pre){
  var a=state.alugueis.find(function(x){return x.id===p.aluguelId})||{};
  var c=D.cli[a.clienteId]||{},it=D.itm[a.itemId]||{};
  var row=(D.byAl[p.aluguelId]||[]).find(function(x){return x.ref===p.ref});
  var d={pagId:p.id,aluguelId:p.aluguelId,ref:p.ref,
    empresa:{nome:cfg.empresaNome||'',doc:cfg.empresaDoc||'',end:cfg.empresaEnd||'',tel:cfg.empresaTel||'',cidade:cfg.cidade||''},
    cliente:{nome:c.nome||'',doc:c.doc||'',tel:c.telefone||''},
    item:{nome:it.nome||'',codigo:it.codigo||''},
    desc:row?whatText(row):(p.ref&&p.ref!=='total'?'Mensalidade '+p.ref.slice(5)+'/'+p.ref.slice(0,4):'Aluguel'),
    valor:p.valor,encargos:Number(p.encargos)||0,forma:p.forma||'',data:p.data,regEm:p.criadoEm||Date.now(),obs:p.obs||''};
  if(pre){d.valorCobranca=pre.valorCobranca;d.saldoAntes=pre.saldoAntes;d.saldoApos=pre.saldoApos;d.situacao=pre.saldoApos<=0?'Quitado':'Pagamento parcial'}
  else d.retroativo=true;
  if(p.exemplo)d.exemplo=true;
  return d;
}
/* modelo único do recibo: a tela, o PDF, a imagem e a impressão saem dele */
function reciboModel(rec,via,pg){
  var e=rec.empresa||{},cl=rec.cliente||{},it=rec.item||{};
  var estor=pg&&pg.estornadoPor?(state.pagamentos.find(function(x){return x.id===pg.estornadoPor})||{}):null;
  var emp=[e.nome||'[Dados da empresa não preenchidos]'];
  if(e.doc)emp.push('CNPJ/CPF: '+e.doc);
  if(e.end)emp.push(e.end);
  if(e.tel)emp.push('Telefone: '+e.tel);
  var b=[];
  var rc=[['Nome',cl.nome||'—']];if(cl.doc)rc.push(['CPF/CNPJ',cl.doc]);
  b.push({t:'Recebido de',l:rc});
  var rf=[['Item',(it.nome||'—')+(it.codigo?' ('+it.codigo+')':'')],['Cobrança',rec.desc||''],['Contrato',String(rec.aluguelId||'').slice(-6).toUpperCase()]];
  b.push({t:'Referente a',l:rf});
  var vl=[];
  if(rec.valorCobranca!=null)vl.push(['Valor da cobrança',money(rec.valorCobranca)]);
  if(rec.encargos>0)vl.push(['Multa e juros',money(rec.encargos)]);
  if(rec.saldoApos!=null)vl.push(['Saldo restante da cobrança',money(rec.saldoApos)]);
  if(rec.situacao)vl.push(['Situação',rec.situacao]);
  if(vl.length)b.push({t:'Valores',l:vl});
  var pa=[['Forma de pagamento',rec.forma||'—'],['Data do pagamento',fmtDate(rec.data)],['Registrado em',fmtDH(rec.regEm)],['Recebido por',rec.emitidoPor||'—'],['Recibo emitido em',fmtDH(rec.emitidoEm)]];
  b.push({t:'Pagamento',l:pa});
  if(rec.obs)b.push({t:'Observações',l:[['',rec.obs]]});
  var rod=['Este recibo comprova o recebimento do valor acima.'];
  if(rec.retroativo)rod.push('Recibo gerado depois do pagamento, com os dados que o sistema tinha na hora.');
  if(rec.exemplo)rod.push('DADOS DE EXEMPLO.');
  return{emp:emp,titulo:'RECIBO DE PAGAMENTO',numero:'Nº '+rec.numero,selo:via>1?'SEGUNDA VIA':'',
    cancel:estor?'CANCELADO · pagamento estornado'+(estor.data?' em '+fmtDate(estor.data):''):'',
