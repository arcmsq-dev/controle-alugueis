var pendingFoto=null;
function shrink(file){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      var k=Math.min(1,1280/Math.max(img.naturalWidth,img.naturalHeight)),wd=Math.round(img.naturalWidth*k),ht=Math.round(img.naturalHeight*k);
      var cv=document.createElement('canvas');cv.width=wd;cv.height=ht;
      cv.getContext('2d').drawImage(img,0,0,wd,ht);URL.revokeObjectURL(url);
      cv.toBlob(function(b){b?res(b):rej(new Error('Não foi possível preparar a foto.'))},'image/jpeg',0.82);
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('Não foi possível ler esta imagem.'))};
    img.src=url;
  });
}
function upErr(e){

/* ---------- assinatura na tela ---------- */
function makePad(cv){
  var ctx=cv.getContext('2d'),drawing=false,ink=false,last=null;
  ctx.lineWidth=2.6;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#111';
  function pos(e){var r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}}
  cv.addEventListener('pointerdown',function(e){
    drawing=true;last=pos(e);
    try{cv.setPointerCapture(e.pointerId)}catch(x){}
    ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(last.x+0.1,last.y+0.1);ctx.stroke();ink=true;e.preventDefault();
  });
  cv.addEventListener('pointermove',function(e){
    if(!drawing)return;
    var p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;e.preventDefault();
  });
  ['pointerup','pointercancel'].forEach(function(n){cv.addEventListener(n,function(){drawing=false})});
  return{
    clear:function(){ctx.clearRect(0,0,cv.width,cv.height);ink=false},
    has:function(){return ink},
    data:function(){return cv.toDataURL('image/png')},
    load:function(src){
      var im=new Image();
      im.onload=function(){
        ctx.clearRect(0,0,cv.width,cv.height);
        var k=Math.min(cv.width/im.width,cv.height/im.height),w2=im.width*k,h2=im.height*k;
        ctx.drawImage(im,(cv.width-w2)/2,(cv.height-h2)/2,w2,h2);ink=true;
      };
      im.src=src;
    }
  };
}
function sha256(text){
  try{
    return crypto.subtle.digest('SHA-256',new TextEncoder().encode(text)).then(function(h){
      return Array.prototype.map.call(new Uint8Array(h),function(b){return b.toString(16).padStart(2,'0')}).join('');
    });
  }catch(e){return Promise.resolve('')}
}

var CATS=['Aluguel do ponto','Energia','Água','Internet e telefone','Peças e equipamentos','Manutenção','Impostos e taxas','Salários e retiradas','Marketing','Outros'];
var RECS=[['unica','Uma vez'],['semanal','Toda semana'],['mensal','Todo mês'],['anual','Todo ano']];
function recTxt(d){
  var r=d.recorrencia||'unica';
  if(r==='mensal')return'Todo mês, dia '+Number((d.vencimento||'').slice(8));
  if(r==='semanal')return'Toda semana';
  if(r==='anual')return'Todo ano, '+fmtShort(d.vencimento);
  return'Uma vez';
}
function despDates(d,limit){
  var out=[],start=d.vencimento,rec=d.recorrencia||'unica';
  if(!start)return out;
  if(rec==='unica'){if(start<=limit)out.push(start);return out}
  var floor=d.criadoEm?addDays(ymd(new Date(d.criadoEm)),-31):'0000-00-00';
  var end=d.fim&&d.fim<limit?d.fim:limit;
  var p=start.split('-').map(Number),y=p[0],m=p[1],dd=p[2],cur=start,k=0,guard=0;
  while(cur<=end&&guard++<600){
    if(cur>=floor)out.push(cur);
    k++;
    if(rec==='semanal')cur=addDays(start,7*k);
    else if(rec==='mensal'){var mm=m-1+k,yy=y+Math.floor(mm/12);mm=mm%12+1;cur=yy+'-'+pad(mm)+'-'+pad(Math.min(dd,lastDay(yy,mm)))}
    else{var y2=y+k;cur=y2+'-'+pad(m)+'-'+pad(Math.min(dd,lastDay(y2,m)))}
  }
  return out;
}
function despRowsAll(t){
  var limit=addDays(t,30),rows=[];
  state.despesas.forEach(function(d){
    if(d.cancelada)return;
    var pays=state.despPag.filter(function(p){return p.despesaId===d.id});
    despDates(d,limit).forEach(function(venc){
      var pg=pays.filter(function(p){return p.ref===venc});
      var delta=d2n(venc)-d2n(t);
      rows.push({d:d,ref:venc,venc:venc,valor:Number(d.valor)||0,pago:sumBy(pg,function(p){return p.valor}),status:sumBy(pg,function(p){return p.valor})>0?'pago':delta<0?'atrasado':delta===0?'hoje':'aberto',delta:delta});
    });
  });
  return rows;
}
function pillDesp(r){
  if(r.status==='pago')return'<span class="pill good">Paga</span>';
  if(r.status==='atrasado')return'<span class="pill bad">Atrasada '+(-r.delta)+' d</span>';
  if(r.status==='hoje')return'<span class="pill warn">Vence hoje</span>';
  return'<span class="pill '+(r.delta<=7?'warn':'info')+'">'+(r.delta===1?'Vence amanhã':'Vence em '+r.delta+' d')+'</span>';
}
function gcalHref(d,venc){
  var e=encodeURIComponent,ds=venc.replace(/-/g,''),de=addDays(venc,1).replace(/-/g,'');
  var det='Valor previsto: '+money(d.valor)+(d.fornecedor?'\nFornecedor: '+d.fornecedor:'')+(d.categoria?'\nCategoria: '+d.categoria:'');
  var u='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+e('Pagar: '+d.descricao)+'&dates='+ds+'/'+de+'&details='+e(det);

  if(rr)u+='&recur='+e('RRULE:FREQ='+rr);
  return u;
}

/* ---------- relatório mensal ---------- */
function mesLabel(m){var p=m.split('-');return MESES_L[Number(p[1])-1]+' de '+p[0]}
function moveMes(m,k){var p=m.split('-').map(Number),x=p[0]*12+p[1]-1+k;return Math.floor(x/12)+'-'+pad(x%12+1)}
function relData(mes){
  var cmp=function(a,b){return String(a.data).localeCompare(String(b.data))||(a.criadoEm||0)-(b.criadoEm||0)};
  var pags=state.pagamentos.filter(function(p){return(p.data||'').slice(0,7)===mes}).sort(cmp);
  var dps=state.despPag.filter(function(p){return(p.data||'').slice(0,7)===mes}).sort(cmp);
  var porForma={},porTipo={},porItem={},porCat={};
  pags.forEach(function(p){
    var a=state.alugueis.find(function(x){return x.id===p.aluguelId}),it=a?D.itm[a.itemId]:null,v=Number(p.valor)||0;
    var f=p.forma||'Outro';porForma[f]=(porForma[f]||0)+v;
    var tp=it?(it.tipo==='assinatura'?'Assinaturas':'Equipamentos'):'Outros';porTipo[tp]=(porTipo[tp]||0)+v;
    var nm=it?it.nome:'Item removido';porItem[nm]=(porItem[nm]||0)+v;
  });
  dps.forEach(function(p){
    var d=state.despesas.find(function(x){return x.id===p.despesaId}),c=d?(d.categoria||'Sem categoria'):'Despesa removida';
    porCat[c]=(porCat[c]||0)+(Number(p.valor)||0);
  });
  var comp=D.rows.filter(function(r){return r.venc.slice(0,7)===mes});
  var tot=sumBy(pags,function(p){return p.valor}),dtot=sumBy(dps,function(p){return p.valor});
  return{mes:mes,pags:pags,dps:dps,total:tot,enc:sumBy(pags,function(p){return p.encargos}),despTotal:dtot,resultado:fromC(toC(tot)-toC(dtot)),
    porForma:porForma,porTipo:porTipo,porItem:porItem,porCat:porCat,
    prevTotal:sumBy(state.pagamentos.filter(function(p){return(p.data||'').slice(0,7)===moveMes(mes,-1)}),function(p){return p.valor}),
    previsto:sumBy(comp,function(r){return r.valor}),pagoComp:sumBy(comp,function(r){return Math.min(r.pago,r.valor)}),nAbertos:comp.filter(function(r){return r.status!=='pago'}).length,saldoComp:sumBy(comp,function(r){return r.saldo})};
}
function hbars(obj,limit){
  var arr=Object.keys(obj).map(function(k){return{l:k,v:obj[k]}}).sort(function(a,b){return b.v-a.v}).slice(0,limit||8);
  if(!arr.length)return'<div class="sumline">Sem dados neste mês.</div>';
  var max=Math.max.apply(null,arr.map(function(x){return x.v}))||1;
  return'<div style="padding-bottom:8px">'+arr.map(function(x){return'<div class="hb"><div class="l">'+esc(x.l)+'</div><div class="t"><i style="width:'+Math.max(2,Math.round(x.v/max*100))+'%"></i></div><div class="v">'+money(x.v)+'</div></div>'}).join('')+'</div>';
}

function csvCell(v){v=String(v==null?'':v);return/[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function csvNum(n){return(Number(n)||0).toFixed(2).replace('.',',')}
function relCsv(R){
  var lines=[['Data','Cliente','Item','Referência','Forma','Valor','Multa e juros'].join(';')];
  R.pags.forEach(function(p){
    var a=state.alugueis.find(function(x){return x.id===p.aluguelId});
    lines.push([fmtDate(p.data),a?nomeCli(a.clienteId):'Aluguel removido',a?nomeItem(a.itemId):'',p.ref&&p.ref!=='total'?p.ref:'',p.forma||'',csvNum(p.valor),csvNum(p.encargos)].map(csvCell).join(';'));
  });
  lines.push(['Total','','','','',csvNum(R.total),csvNum(R.enc)].map(csvCell).join(';'));
  return'﻿'+lines.join('\r\n');
}

function delMeta(key){delete meta[key];return idbOpen().then(function(db){return new Promise(function(res){var t=db.transaction('meta','readwrite');t.objectStore('meta').delete(key);t.oncomplete=function(){res()};t.onerror=function(){res()}})})}
function loadAll(){

/* ---------- notificações (onSnapshot) ---------- */
var subs=[],dirty={},ntimer=0;
function mark(col){
  if(col==='_users'&&OFF.render)setTimeout(OFF.render,0);
  dirty[col]=1;
  if(!ntimer)ntimer=setTimeout(function(){
    ntimer=0;var d=dirty;dirty={};
    subs.slice().forEach(function(s){if(d[s.col])fire(s)});
  },0);
}
function live(col){var o=C[col]||{};return Object.keys(o).map(function(k){return o[k]}).filter(function(r){return!r.d})}
function semFin(col){return!!FIN[col]&&(!cur||cur.role!=='admin')}
function colSnap(col){
  var l=semFin(col)?[]:live(col);
  return{size:l.length,empty:!l.length,docs:l.map(function(r){return{id:r.id,exists:true,data:function(){return clone(r.data)}}})};
}
function docSnap(col,id){
  var r=(C[col]||{})[id],ok=!!r&&!r.d&&!semFin(col);
  return{id:id,exists:ok,data:function(){return ok?clone(r.data):undefined}};
}
function fire(s){try{s.cb(s.id===undefined?colSnap(s.col):docSnap(s.col,s.id))}catch(e){console.error(e)}}

/* ---------- dinheiro em centavos inteiros ---------- */
/* Os valores já gravados continuam em reais com 2 casas (nada é reescrito no armazenamento);
   toda conta é feita em centavos inteiros e só volta a reais na hora de mostrar ou gravar. */
function toC(x){var n=Number(x);if(!isFinite(n))return 0;return Math.round(Number((n*100).toFixed(4)))}
function fromC(c){return Math.round(c)/100}
function rndC(x){return Math.round(Number(Number(x).toFixed(6)))}   /* arredonda centavos (meio para cima) */
function sumC(arr,fn){var s=0;for(var i=0;i<arr.length;i++)s+=toC(fn?fn(arr[i]):arr[i]);return s}
OFF.toC=toC;OFF.fromC=fromC;OFF.rndC=rndC;OFF.sumC=sumC;

var AUD={manutencoes:1,vistorias:1,reservas:1,fin_contas:1,fin_lanc:1,fin_cartoes:1,fin_cartao_lanc:1,fin_orcamentos:1,fin_metas:1,fin_aportes:1,clientes:1,itens:1,alugueis:1,pagamentos:1,fotos:1,despesas:1,despPag:1,assinaturas_digitais:1,recibos:1,contatos:1,config:1};

function grande(v){return typeof v==='string'&&v.length>200?'[conteúdo grande]':v}
function enxuto(o){
  if(!o||typeof o!=='object')return o;
  var r={};Object.keys(o).forEach(function(k){var v=o[k];r[k]=(v&&typeof v==='object')?'[dados]':grande(v)});return r;
}
function mudou(a,b){
  var ks={},r={antes:{},depois:{}};
  Object.keys(a||{}).concat(Object.keys(b||{})).forEach(function(k){ks[k]=1});
  Object.keys(ks).forEach(function(k){
    if(JSON.stringify((a||{})[k])!==JSON.stringify((b||{})[k])){r.antes[k]=enxuto({x:(a||{})[k]}).x;r.depois[k]=enxuto({x:(b||{})[k]}).x}
  });
  return r;
}
/* histórico: só inclui registros; ninguém (nem o administrador) edita ou apaga por aqui */
function audita(acao,col,id,antes,depois){
  if(!cur||!AUD[col])return Promise.resolve();
  var e={acao:acao,col:col,reg:id,quem:cur.id,nome:cur.nome,quando:Date.now(),aparelho:DEV()};
  if(acao==='excluir')e.antes=enxuto(antes);
  else if(acao==='alterar'){var m=mudou(antes,depois);e.antes=m.antes;e.depois=m.depois;if(!Object.keys(m.depois).length)return Promise.resolve()}
  else e.depois=enxuto(depois);
  return writeRec('auditoria',rid(10),e,false,true).catch(function(){});
}
/* recibos: número sequencial por ano, emissão idempotente (1 recibo por pagamento) e em fila (nunca dois com o mesmo número neste aparelho) */
var reciboFila=Promise.resolve();
function reciboNum(ano){
  var mx=0;
  live('recibos').forEach(function(r){if(r.data&&String(r.data.ano)===String(ano)&&r.data.seq>mx)mx=r.data.seq});
  return mx+1;
}
OFF.emitirRecibo=function(id,dados){
  var p=reciboFila.then(function(){
    if(!cur)throw perr('Entre com seu usuário primeiro.');
    var ex=(C.recibos||{})[id];
    if(ex&&!ex.d)return{criado:false,dados:clone(ex.data)};
    var ano=new Date().getFullYear(),seq=reciboNum(ano);
    var d=Object.assign({},dados,{ano:ano,seq:seq,numero:ano+'-'+String(seq).padStart(6,'0'),emitidoEm:Date.now(),emitidoPor:cur.nome,emitidoPorId:cur.id,aparelho:DEV()});
    return writeRec('recibos',id,d,false,true).then(function(){return audita('criar','recibos',id,null,{numero:d.numero,valor:d.valor,pagamento:d.pagId})}).then(function(){return{criado:true,dados:d}});
  });
  reciboFila=p.catch(function(){});
  return p;
};

OFF.confereSenhaLogin=function(pwd){var u=cur?usersAll().filter(function(x){return x.id===cur.id})[0]:null;return u?verifyUser(u,String(pwd||'')):Promise.resolve(false)};
function guarda(col,id,apagando){
  if(col.charAt(0)==='_')return perr('Coleção reservada.');
  if(!cur)return perr('Entre com seu usuário primeiro.');
  if(FIN[col]&&cur.role!=='admin')return uerr('As finanças pessoais são só do administrador.');
  if(col==='auditoria')return uerr('O histórico de alterações não pode ser alterado.');
  if(col==='lixeira')return uerr('A lixeira só é alterada pelas telas de restaurar e excluir definitivamente.');
  if(col==='recibos'){
    if(apagando){var rr=(C.recibos||{})[id];if(rr&&!rr.d&&rr.data&&rr.data.exemplo)return null}
    return uerr('Recibos só são emitidos pelo botão Recibo e nunca são alterados nem apagados.');
  }
  if(col==='config'&&cur.role!=='admin')return uerr('Só o administrador altera os ajustes.');
  if(apagando&&SO_ADMIN_APAGA[col]&&cur.role!=='admin')return uerr('Só o administrador pode excluir. Peça a ele.');
  return null;
}
function finFaturaPaga(cartaoId,mes){return live('fin_lanc').some(function(r){return r.data&&r.data.faturaId===cartaoId+'_'+mes&&r.data.estado==='efetivado'&&!r.data.estornadoPor})}
function writeRec(col,id,data,merge,internal){
  if(!internal){var g=guarda(col,id,false);if(g)return Promise.reject(g)}
  var o=C[col]||(C[col]={}),old=o[id];
  var nd=clone(merge&&old&&!old.d?Object.assign({},old.data,data):data);
  if(!internal&&col==='fin_cartao_lanc'){
    if(old&&!old.d&&old.data&&finFaturaPaga(old.data.cartaoId,old.data.faturaMes)){
      var lv={estornadoPor:1,obs:1},md=false;
      Object.keys(Object.assign({},old.data,nd)).forEach(function(k){if(!lv[k]&&JSON.stringify(old.data[k])!==JSON.stringify(nd[k]))md=true});
      if(md)return Promise.reject(uerr('Esta fatura já está paga e não se altera. Use Estornar.'));
    }else if((!old||old.d)&&finFaturaPaga(nd.cartaoId,nd.faturaMes))return Promise.reject(uerr('Esta fatura já está paga. Use uma data de compra posterior.'));
  }
  if(!internal&&col==='vistorias'&&old&&!old.d&&old.data&&!old.data.exemplo){
    /* vistoria é registro: só ganha a marca de retificação e observação */
    var lvV={retificadaPor:1,obs:1},mdV=false;
    Object.keys(Object.assign({},old.data,nd)).forEach(function(k){if(!lvV[k]&&JSON.stringify(old.data[k])!==JSON.stringify(nd[k]))mdV=true});
    if(mdV)return Promise.reject(uerr('Vistoria registrada não se altera. Use Retificar.'));
  }
  if(!internal&&col==='manutencoes'&&old&&!old.d&&old.data&&old.data.status==='concluida'&&!old.data.cancelada&&!old.data.exemplo){
    /* manutenção concluída é histórico de custo: só pode ser cancelada ou ganhar observação */
    var lvM={cancelada:1,canceladaMotivo:1,canceladaEm:1,obs:1},mdM=false;
    Object.keys(Object.assign({},old.data,nd)).forEach(function(k){if(!lvM[k]&&JSON.stringify(old.data[k])!==JSON.stringify(nd[k]))mdM=true});
    if(mdM)return Promise.reject(uerr('Manutenção concluída não se altera. Cancele e registre outra.'));
  }
  if(!internal&&col==='fin_aportes'&&old&&!old.d&&old.data&&!old.data.exemplo){
    /* aporte da meta é histórico: só ganha a marca de estorno e observação */
    var lvA={estornadoPor:1,obs:1},mdA=false;
    Object.keys(Object.assign({},old.data,nd)).forEach(function(k){if(!lvA[k]&&JSON.stringify(old.data[k])!==JSON.stringify(nd[k]))mdA=true});
    if(mdA)return Promise.reject(uerr('Aporte não pode ser alterado. Use Estornar.'));
  }
  if(!internal&&col==='fin_lanc'&&old&&!old.d&&old.data&&old.data.estado==='efetivado'&&!old.data.exemplo){
    /* lançamento efetivado é histórico: só ganha a marca de estorno e observação */
    var livre={estornadoPor:1,obs:1},mud=false;
    Object.keys(Object.assign({},old.data,nd)).forEach(function(k){if(!livre[k]&&JSON.stringify(old.data[k])!==JSON.stringify(nd[k]))mud=true});
    if(mud)return Promise.reject(uerr('Lançamento efetivado não pode ser alterado. Use Estornar e lance de novo.'));
  }
  var rec={k:col+'/'+id,col:col,id:id,data:nd,u:nowU(),d:0,by:DEV()};
  var existia=!!old&&!old.d,antes=existia?old.data:null;
  return idbPut('docs',[rec]).then(function(){o[id]=rec;mark(col);return internal?null:audita(existia?'alterar':'criar',col,id,antes,nd)}).then(function(){return rec});
}
function delRec(col,id,internal){
  if(!internal){var g=guarda(col,id,true);if(g)return Promise.reject(g)}
  var o=C[col]||(C[col]={}),old=o[id];
  if(!old||old.d)return Promise.resolve();
  var exemplo=!!(old.data&&old.data.exemplo);
  if(!internal&&col==='fin_lanc'&&old.data&&old.data.estado==='efetivado'&&!exemplo)return Promise.reject(uerr('Lançamento efetivado não é apagado. Use Estornar.'));
  if(!internal&&col==='fin_cartao_lanc'&&!exemplo&&old.data&&finFaturaPaga(old.data.cartaoId,old.data.faturaMes))return Promise.reject(uerr('Fatura paga não se altera. Use Estornar.'));
  if(!internal&&col==='fin_cartoes'&&!exemplo&&live('fin_cartao_lanc').some(function(l){return l.data&&l.data.cartaoId===id}))return Promise.reject(uerr('Este cartão tem compras e não pode ser excluído. Arquive-o.'));
  if(!internal&&col==='fin_contas'&&!exemplo&&live('fin_lanc').some(function(l){return l.data&&(l.data.contaId===id||l.data.contaDestinoId===id)}))return Promise.reject(uerr('Esta conta tem lançamentos e não pode ser excluída. Arquive-a.'));
  if(!internal&&col==='vistorias'&&!exemplo)return Promise.reject(uerr('Vistoria não é apagada. Use Retificar.'));
  if(!internal&&col==='manutencoes'&&!exemplo&&old.data&&Number(old.data.custo)>0&&!old.data.cancelada)return Promise.reject(uerr('Manutenção com custo não é apagada. Cancele-a e o histórico fica.'));
  if(!internal&&col==='fin_aportes'&&!exemplo)return Promise.reject(uerr('Aporte não é apagado. Use Estornar.'));
  if(!internal&&col==='fin_orcamentos'&&!exemplo)return Promise.reject(uerr('Orçamento não é apagado: encerre-o e o histórico fica.'));
  if(!internal&&col==='fin_metas'&&!exemplo&&live('fin_aportes').some(function(l){return l.data&&l.data.metaId===id}))return Promise.reject(uerr('Esta meta tem aportes e não pode ser excluída. Arquive-a.'));
  if(!internal&&NAO_APAGA[col]&&!exemplo)return Promise.reject(uerr('Pagamentos e recibos não são apagados. Para pagamentos use Estornar: o original fica no histórico e entra um lançamento de reversão.'));
  var rec={k:col+'/'+id,col:col,id:id,data:null,u:nowU(),d:1,by:DEV()};
  var antes=old.data;
  var lx=(!internal&&TRASH[col]&&!exemplo)?lixoEntrada(col,id,old):Promise.resolve();
  return lx.then(function(){return idbPut('docs',[rec])}).then(function(){o[id]=rec;mark(col);return internal?null:audita('excluir',col,id,antes,null)});
}
function splitPath(p){var i=p.indexOf('/');return[p.slice(0,i),p.slice(i+1)]}
function docRef(col,id){
  return{
    id:id,
    get:function(){return Promise.resolve(docSnap(col,id))},
    set:function(d){return writeRec(col,id,d,false)},
    update:function(d){return writeRec(col,id,d,true)},
    delete:function(){return delRec(col,id)},
    onSnapshot:function(cb,err){var s={col:col,id:id,cb:cb,err:err};subs.push(s);setTimeout(function(){fire(s)},0);return function(){subs=subs.filter(function(x){return x!==s})}}
  };
}
var dbApi={
  collection:function(col){
    return{
      add:function(d){var id=rid(10);return writeRec(col,id,d,false).then(function(){return docRef(col,id)})},
      doc:function(id){return docRef(col,id)},
      get:function(){return Promise.resolve(colSnap(col))},
      onSnapshot:function(cb,err){var s={col:col,cb:cb,err:err};subs.push(s);setTimeout(function(){fire(s)},0);return function(){subs=subs.filter(function(x){return x!==s})}}
    };
  },
  doc:function(path){var p=splitPath(path);return docRef(p[0],p[1])}
};

  },
  list:function(){var l=Object.keys(A).map(function(k){return A[k]}).filter(function(r){return!r.d});return Promise.resolve({assets:l.map(function(r){return{id:r.id,url:urls[r.id],contentType:r.type,sizeBytes:r.blob?r.blob.size:0,createdAt:new Date(r.u).toISOString()}}),usage:{files:l.length}})}
};

/* baixar arquivo */
function saveFile(filename,data,mime){
  var b=data instanceof Blob?data:new Blob([data],{type:mime||'application/octet-stream'});
  var u=URL.createObjectURL(b),a=document.createElement('a');
  a.href=u;a.download=filename;a.style.display='none';document.body.appendChild(a);a.click();
  setTimeout(function(){a.remove();URL.revokeObjectURL(u)},4000);
  return Promise.resolve({status:'saved'});
}
OFF.saveFile=saveFile;

var zc=100;
function modal(title,body,o){
  o=o||{};
  var root=document.createElement('div');root.style.zIndex=++zc;

  return new Promise(function(res){

    var body=brandBlock()+(isLock?'<p style="margin:0 0 10px">Tela bloqueada por inatividade. Digite a senha de <strong>'+esc(cur.nome)+'</strong> para continuar.</p>':F('Usuário','l-user','text',last,'','autocomplete="username" autocapitalize="none" spellcheck="false"'))+

      on:{esqueci:function(){recoverDialog()},troca:function(){endSession()}},
      onSubmit:function(f,a){

        var nome=isLock?cur.nome:V(f,'l-user'),pwd=f.elements['l-pass'].value;

var KEYCH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function genKey(){
  var a=new Uint8Array(16),s='';crypto.getRandomValues(a);
  for(var i=0;i<16;i++){s+=KEYCH.charAt(a[i]%32);if(i%4===3&&i<15)s+='-'}
  return s;
}

}

/* ===== Pacotes: backup, sincronização por arquivo ===== */
function parsePkg(text){
  var p;
  try{p=JSON.parse(text)}catch(e){throw new Error('O arquivo não é um pacote deste sistema.')}
  if(!p||p.fmt!=='ctrl-alugueis'||!Array.isArray(p.docs))throw new Error('O arquivo não é um pacote deste sistema.');
  if((p.pv||1)>1)throw new Error('Este arquivo vem de uma versão mais nova do sistema. Atualize este aparelho primeiro.');
  return p;
}
function blobB64(b){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){var s=String(r.result);res(s.slice(s.indexOf(',')+1))};r.onerror=function(){rej(new Error('Falha ao ler uma foto.'))};r.readAsDataURL(b)})}
function b64Blob(b64,type){var s=atob(b64),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return new Blob([u],{type:type||'image/jpeg'})}

function buildPkgRaw(kind,withPhotos){
  var docs=[];
  Object.keys(C).forEach(function(c){Object.keys(C[c]).forEach(function(id){var r=C[c][id];docs.push({col:r.col,id:r.id,data:r.data,u:r.u,d:r.d?1:0,by:r.by||''})})});
  var list=Object.keys(A).map(function(k){return A[k]});
  return Promise.all(list.map(function(r){
    if(r.d)return{id:r.id,type:r.type,u:r.u,d:1,by:r.by||''};
    if(!withPhotos||!r.blob)return null;
    return blobB64(r.blob).then(function(b){return{id:r.id,type:r.type,u:r.u,d:0,by:r.by||'',b64:b}});
  })).then(function(as){
    var pkg={fmt:'ctrl-alugueis',pv:1,app:VER,kind:kind,grupo:meta.grupo,empresa:meta.empresa||'',de:{dev:meta.dev,nome:meta.devNome,modo:meta.modo},quando:new Date().toISOString(),fotos:!!withPhotos,docs:docs,assets:as.filter(Boolean)};
    return new Blob([JSON.stringify(pkg)],{type:'application/json'});
  });
}
/* com a criptografia ligada, todo arquivo exportado sai cifrado com uma senha do arquivo */
function buildPkg(kind,withPhotos){
  return buildPkgRaw(kind,withPhotos).then(function(b){return ENC.on?OFF.cifraArquivo(b):b});
}
function lerPkgTexto(text){
  if(text.slice(0,80).indexOf('ctrl-alugueis-enc')>=0)return OFF.abreArquivo(text).then(parsePkg);
  return parsePkg(text);
}
function wins(a,b){
  if(!b)return true;
  if(a.u!==b.u)return a.u>b.u;
  return String(a.by||'')>String(b.by||'');
}
function mergePkg(pkg){
  var st={novos:0,atual:0,removidos:0,iguais:0,futuros:0};
  var put=[],cols={},lim=Date.now()+86400000,i;
  pkg.docs.forEach(function(r){
    if(!r||typeof r.col!=='string'||typeof r.id!=='string'||typeof r.u!=='number')return;
    var loc=(C[r.col]||{})[r.id],rec={k:r.col+'/'+r.id,col:r.col,id:r.id,data:r.d?null:r.data,u:r.u,d:r.d?1:0,by:r.by||''};
    if(r.u>lim)st.futuros++;
    if(!wins(rec,loc)){st.iguais++;return}
    if(rec.d){if(loc&&!loc.d)st.removidos++}
    else if(!loc||loc.d)st.novos++;else st.atual++;
    put.push(rec);
  });
  var aput=[],pend=[];
  (pkg.assets||[]).forEach(function(a){
    if(!a||typeof a.id!=='string')return;
    var loc=A[a.id],rec={id:a.id,type:a.type,u:a.u||0,d:a.d?1:0,by:a.by||''};
    if(!wins(rec,loc))return;
    if(rec.d){rec.blob=null;aput.push(rec)}
    else if(a.b64){rec.blob=b64Blob(a.b64,a.type);aput.push(rec)}
  });
  return idbPut('docs',put).then(function(){return idbPut('assets',aput)}).then(function(){
    put.forEach(function(r){(C[r.col]||(C[r.col]={}))[r.id]=r;cols[r.col]=1;if(r.u>lastU)lastU=r.u});
    aput.forEach(function(r){
      A[r.id]=r;if(r.u>lastU)lastU=r.u;
      if(urls[r.id]){URL.revokeObjectURL(urls[r.id]);delete urls[r.id]}
      if(!r.d&&r.blob)urls[r.id]=URL.createObjectURL(r.blob);
    });
    Object.keys(cols).forEach(mark);
    st.fotos=aput.filter(function(r){return!r.d}).length;
    return st;
  });
}
function restorePkg(pkg){
  var cripto=ENC.on;
  /* com a criptografia ligada, o aparelho mantém os próprios usuários e senhas (cada um tem a chave de dados embrulhada com a sua senha) */
  if(cripto)pkg=Object.assign({},pkg,{docs:pkg.docs.filter(function(r){return r.col!=='_users'})});
  var limpa=cripto?OFF.encLimpaDados():idbClear(['docs','assets']);
  return limpa.then(function(){
    if(!cripto)C={};
    Object.keys(urls).forEach(function(k){URL.revokeObjectURL(urls[k])});A={};urls={};
    return mergePkg(pkg);
  }).then(function(st){return setMeta('grupo',pkg.grupo||rid(8)).then(function(){return st})});
}

function snapAll(){
  return snapDb().then(function(db){return new Promise(function(res){
    var g=db.transaction('s').objectStore('s').getAll();
    g.onsuccess=function(){res((g.result||[]).sort(function(a,b){return b.quando-a.quando}))};g.onerror=function(){res([])};
  })}).catch(function(){return[]});

/* guarda uma cópia dos dados e mantém só as 3 mais recentes. Devolve a cópia, ou null se falhar. */
OFF.snapshot=function(motivo){
  var docs=[];
  Object.keys(C).forEach(function(c){Object.keys(C[c]).forEach(function(i){var r=C[c][i];docs.push({k:r.k,col:r.col,id:r.id,data:r.data,u:r.u,d:r.d?1:0,by:r.by||''})})});
  if(ENC.on&&!ENC.key){setMeta('snapPend',motivo);return Promise.resolve(null)}   /* dados ainda protegidos: a cópia sai logo depois do login */
  if(!docs.length)return Promise.resolve(null);
  var rec={id:'s'+Date.now(),quando:Date.now(),motivo:motivo,ver:VER,n:docs.filter(function(d){return!d.d}).length};
  var pr=ENC.on?OFF.encSnap(rec,docs):Promise.resolve(Object.assign(rec,{docs:docs}));
  return pr.then(function(rec2){rec=rec2;return snapDb()}).then(function(db){return new Promise(function(res,rej){
    var t=db.transaction('s','readwrite');t.objectStore('s').put(rec);
    t.oncomplete=function(){res()};t.onerror=t.onabort=function(){rej(t.error)};
  })}).then(function(){return snapAll()}).then(function(all){
    return snapDb().then(function(db){return new Promise(function(res){
      var t=db.transaction('s','readwrite');all.slice(3).forEach(function(x){t.objectStore('s').delete(x.id)});
      t.oncomplete=function(){res(rec)};t.onerror=function(){res(rec)};
    })});
  }).catch(function(){return null});
};
OFF.snapAll=snapAll;
function restoreSnap(id){
  return snapAll().then(function(all){
    var rec=all.filter(function(x){return x.id===id})[0];
    if(!rec)throw new Error('Cópia não encontrada.');
    return (rec.enc?OFF.encSnapAbre(rec):Promise.resolve(rec)).then(function(r2){return restoreSnap2(r2,id)});
  });
}
function restoreSnap2(rec,id){
  return Promise.resolve().then(function(){
    var skip={_users:1,auditoria:1},keys={},put=[],cols={};
    rec.docs.forEach(function(r){if(skip[r.col])return;keys[r.k]=1;put.push({k:r.k,col:r.col,id:r.id,data:r.data,u:nowU(),d:r.d?1:0,by:DEV()})});
    Object.keys(C).forEach(function(c){if(skip[c])return;Object.keys(C[c]).forEach(function(i){
      var r=C[c][i];if(!r.d&&!keys[r.k])put.push({k:r.k,col:r.col,id:r.id,data:null,u:nowU(),d:1,by:DEV()});
    })});
    return idbPut('docs',put).then(function(){
      put.forEach(function(r){(C[r.col]||(C[r.col]={}))[r.id]=r;cols[r.col]=1});
      Object.keys(cols).forEach(mark);
      return writeRec('auditoria',rid(10),{acao:'restaurar-copia',col:'(tudo)',reg:id,quem:cur.id,nome:cur.nome,quando:Date.now(),aparelho:DEV(),depois:{copia:fmtDT(rec.quando),motivo:rec.motivo}},false,true);
    }).then(function(){return rec});
  });
}

/* ===== Atualização do sistema (GitHub ou arquivo local) ===== */
function bootDb(){
  return new Promise(function(res,rej){
    var r=indexedDB.open('ctrl_boot',1);
    r.onupgradeneeded=function(){r.result.createObjectStore('b')};
    r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)};
  });
}
function lsOk(){try{localStorage.setItem('ctrl_t','1');localStorage.removeItem('ctrl_t');return true}catch(e){return false}}
function getBundleInfo(){
  return bootDb().then(function(db){return new Promise(function(res){
    var g=db.transaction('b').objectStore('b').get('bundle');
    g.onsuccess=function(){res(g.result||null)};g.onerror=function(){res(null)};
  })}).catch(function(){return null});
}
function saveBundle(html,ver,origem,sha){
  if(!lsOk())return Promise.reject(new Error('Este navegador não permite guardar a atualização.'));
  return bootDb().then(function(db){return new Promise(function(res,rej){
    var t=db.transaction('b','readwrite');
    t.objectStore('b').put({versao:ver,html:html,sha:sha||'',origem:origem,quando:Date.now()},'bundle');
    t.oncomplete=function(){res()};t.onerror=t.onabort=function(){rej(t.error||new Error('Não foi possível guardar a atualização.'))};
  })}).then(function(){
    localStorage.setItem('ctrl_bundle',ver);localStorage.removeItem('ctrl_boot_try');localStorage.removeItem('ctrl_boot_fail');
  });
}
function validateBundle(html){
  if(typeof html!=='string'||html.length<150000)throw new Error('O arquivo não parece ser uma versão completa do sistema.');
  if(html.indexOf('name="ctrl-alugueis-app"')<0||html.indexOf('__Q.push')<0)throw new Error('Este arquivo não é uma versão do Controle de Aluguéis.');
  var m=/<meta name="app-versao" content="(\d+\.\d+\.\d+)">/.exec(html);
  if(!m)throw new Error('O arquivo não informa a versão.');
  return m[1];
}
function repoCfg(){var u=meta.upd||{};return{repo:u.repo||window.__DEFAULT_REPO||'',branch:u.branch||'main'}}
function normRepo(s){
  s=String(s||'').trim();
  var m=/github\.com\/([\w.-]+)\/([\w.-]+?)(?:\.git)?(?:[\/#?].*)?$/i.exec(s);
  if(m)return m[1]+'/'+m[2];
  m=/^([\w.-]+)\/([\w.-]+)$/.exec(s);
  return m?m[1]+'/'+m[2]:'';
}
function rawBase(){var r=repoCfg();return r.repo?'https://raw.githubusercontent.com/'+r.repo+'/'+r.branch+'/':null}
function checkUpdate(){
  var b=rawBase();
  if(!b)return Promise.reject(new Error('Informe primeiro o repositório do GitHub onde ficam as atualizações.'));
  return fetch(b+'versao.json?_='+Date.now(),{cache:'no-store'}).then(function(r){
    if(!r.ok)throw new Error(r.status===404?'Não encontrei o arquivo versao.json neste repositório.':'O GitHub respondeu com erro '+r.status+'.');
    return r.json();
  },function(){throw new Error('Sem acesso à internet agora.')}).then(function(j){
    if(!j||!/^\d+\.\d+\.\d+$/.test(j.versao||'')||typeof j.arquivo!=='string'||/\.\.|^\/|:/.test(j.arquivo)||!/^[0-9a-f]{64}$/.test(j.sha256||''))throw new Error('O arquivo versao.json está incompleto.');
    return j;
  }).then(function(j){return setMeta('updCheck',Date.now()).then(function(){return j})});
}
function installOnline(info){
  var b=rawBase();
  return fetch(b+info.arquivo+'?_='+Date.now(),{cache:'no-store'}).then(function(r){
    if(!r.ok)throw new Error('Não consegui baixar a atualização ('+r.status+').');
    return r.arrayBuffer();
  },function(){throw new Error('A conexão caiu durante o download.')}).then(function(buf){
    return sha256hex(buf).then(function(h){
      if(h!==info.sha256)throw new Error('O arquivo baixado não confere com o esperado (código SHA-256 diferente). Nada foi instalado.');
      var html=new TextDecoder('utf-8').decode(buf),v=validateBundle(html);
      if(v!==info.versao)throw new Error('A versão do arquivo ('+v+') não bate com a anunciada ('+info.versao+').');
      return saveBundle(html,v,'github:'+repoCfg().repo,h).then(function(){return v});
    });
  });
}
function installFile(){
  return pickFile('.html,text/html').then(function(f){
    if(!f)return null;
    return readText(f).then(function(html){
      var v=validateBundle(html),base=window.__BUILTIN||VER;
      if(cmpVer(v,base)<=0)throw new Error('A versão '+v+' não é mais nova que a de fábrica deste aparelho ('+base+'). Para voltar a uma versão antiga, use “Voltar à versão de fábrica”.');
      var go=cmpVer(v,VER)===0?confirmBox('Mesma versão','Esta é a versão '+v+', que já está em uso. Instalar de novo?','Instalar'):cmpVer(v,VER)<0?confirmBox('Versão anterior','A versão '+v+' é mais antiga que a atual ('+VER+'). Instalar mesmo assim?','Instalar',true):Promise.resolve(true);
      return go.then(function(ok){if(!ok)return null;return sha256hex(html).then(function(h){return saveBundle(html,v,'arquivo local',h)}).then(function(){return v})});
    });
  });
}

/* ===== Lixeira: restaurar com validação e excluir definitivamente (só administrador) ===== */
function lixoTodos(){return live('lixeira').map(function(r){return Object.assign({id:r.id},r.data)})}
function lixoRaizes(){return lixoTodos().filter(function(e){return e.raiz&&e.estado==='lixeira'}).sort(function(a,b){return b.em-a.em})}
function lixoGrupo(g){return lixoTodos().filter(function(e){return e.grupo===g&&e.estado==='lixeira'})}
function vivo(col,id){var r=(C[col]||{})[id];return!!r&&!r.d}
function nomeLixo(col,id){
  var e=lixoTodos().filter(function(x){return x.col===col&&x.regId===id&&x.estado==='lixeira'})[0];
  return e?(e.titulo||e.tipo):'';
}
/* devolve a lista de motivos pelos quais NÃO dá para restaurar; vazia = pode */
function lixoProblemas(grupo){
  var er=[],ids={};
  grupo.forEach(function(e){ids[e.col+'/'+e.regId]=1});
  grupo.forEach(function(e){
    var rot=(e.titulo||e.tipo||e.col);
    if(!e.data||typeof e.data!=='object'){er.push(rot+': o conteúdo guardado está vazio ou danificado.');return}
    try{JSON.parse(JSON.stringify(e.data))}catch(x){er.push(rot+': o conteúdo guardado está danificado.');return}
    if(vivo(e.col,e.regId))er.push(rot+': já existe um registro ativo com o mesmo código.');
    if(e.col==='alugueis'){
      var cl=e.data.clienteId,it=e.data.itemId;
      if(!vivo('clientes',cl)&&!ids['clientes/'+cl])er.push(nomeLixo('clientes',cl)?'O cliente “'+nomeLixo('clientes',cl)+'” está na lixeira. Restaure-o primeiro.':'O cliente deste aluguel não existe mais.');
      if(!vivo('itens',it)&&!ids['itens/'+it])er.push(nomeLixo('itens',it)?'O item “'+nomeLixo('itens',it)+'” está na lixeira. Restaure-o primeiro.':'O item deste aluguel não existe mais.');
      var itRec=(C.itens||{})[it],tipoItem=itRec&&!itRec.d&&itRec.data?itRec.data.tipo:null;
      if(e.data.status!=='encerrado'&&tipoItem!=='assinatura'){
        var outro=live('alugueis').filter(function(r){return r.id!==e.regId&&r.data.itemId===it&&r.data.status!=='encerrado'})[0];
        if(outro)er.push('O equipamento já está em outro aluguel ativo.');
      }
    }
    if(e.col==='fin_lanc'){
      var ct=e.data.contaId;
      if(!vivo('fin_contas',ct)&&!ids['fin_contas/'+ct])er.push('A conta deste lançamento não está ativa. Restaure a conta primeiro.');
    }
    if(e.col==='fin_cartao_lanc'){
      var cd=e.data.cartaoId;
      if(!vivo('fin_cartoes',cd)&&!ids['fin_cartoes/'+cd])er.push('O cartão desta compra não está ativo. Restaure o cartão primeiro.');
      if(finFaturaPaga(cd,e.data.faturaMes))er.push('A fatura desta compra já foi paga e não aceita compras de volta.');
    }
    if(e.col==='fotos'){
      var al=e.data.aluguelId;
      if(!vivo('alugueis',al)&&!ids['alugueis/'+al])er.push('A foto pertence a um aluguel que não está ativo. Restaure o aluguel primeiro.');
      var a=A[e.data.assetId];
      if(!a||a.d||!a.blob)er.push('O arquivo da foto foi removido e não pode voltar.');
    }
    if(e.col==='assinaturas_digitais'&&e.data.aluguelId){
      if(!vivo('alugueis',e.data.aluguelId)&&!ids['alugueis/'+e.data.aluguelId])er.push('As assinaturas pertencem a um aluguel que não está ativo. Restaure o aluguel primeiro.');
    }
  });
  return er;
}
function lixoRestaurar(raizId){
  var raiz=lixoTodos().filter(function(e){return e.id===raizId})[0];
  if(!raiz)return Promise.reject(new Error('Item não encontrado na lixeira.'));
  var grupo=lixoGrupo(raiz.grupo),er=lixoProblemas(grupo);
  if(er.length)return Promise.reject(new Error(er.join('\n')));
  /* restaura primeiro clientes/itens/aluguéis, depois o que depende deles */
  var ordem={clientes:0,itens:0,fin_contas:0,fin_cartoes:0,fin_metas:0,manutencoes:1,reservas:1,fin_cartao_lanc:1,alugueis:1,despesas:1,fin_lanc:1,fotos:2,assinaturas_digitais:2};
  grupo.sort(function(a,b){return(ordem[a.col]||0)-(ordem[b.col]||0)});
  var p=Promise.resolve();
  grupo.forEach(function(e){
    p=p.then(function(){return writeRec(e.col,e.regId,e.data,false,true)}).then(function(){
      var d=Object.assign({},e);delete d.id;d.estado='restaurado';d.restauradoEm=Date.now();d.restauradoPor=cur.nome;
      return writeRec('lixeira',e.id,d,false,true);
    });
  });
  return p.then(function(){
    return writeRec('auditoria',rid(10),{acao:'restaurar',col:raiz.col,reg:raiz.regId,quem:cur.id,nome:cur.nome,quando:Date.now(),aparelho:DEV(),depois:{item:raiz.titulo||raiz.tipo,registros:grupo.length}},false,true);
  });
}
function lixoApagarDeVez(raizId){
  var raiz=lixoTodos().filter(function(e){return e.id===raizId})[0];
  if(!raiz)return Promise.reject(new Error('Item não encontrado na lixeira.'));
  var grupo=lixoGrupo(raiz.grupo),p=Promise.resolve();
  grupo.forEach(function(e){
    p=p.then(function(){return e.col==='fotos'&&e.data&&e.data.assetId&&assetsApi?assetsApi.delete(e.data.assetId):null}).then(function(){
      var d=Object.assign({},e);delete d.id;d.data=null;d.estado='removido';d.removidoEm=Date.now();d.removidoPor=cur.nome;
      return writeRec('lixeira',e.id,d,false,true);
    });
  });
  return p.then(function(){
    return writeRec('auditoria',rid(10),{acao:'excluir-definitivo',col:raiz.col,reg:raiz.regId,quem:cur.id,nome:cur.nome,quando:Date.now(),aparelho:DEV(),antes:{item:raiz.titulo||raiz.tipo,motivo:raiz.motivo}},false,true);
  });
}
function lixeiraDialog(){
  if(!OFF.can('auditoria'))return;
  var l=lixoRaizes();
  var body=l.length?l.map(function(e){
    var n=lixoGrupo(e.grupo).length;
    return'<div class="row"><div class="r-main"><strong>'+esc(e.tipo||e.col)+(e.titulo?' · '+esc(e.titulo):'')+'</strong>'+

/* ===== Criptografia em repouso (etapa 13): AES-256-GCM, opcional, ligada em Ajustes =====
   - Uma chave de dados aleatória (DEK) cifra todos os registros e fotos (exceto os usuários, que guardam só sal e resumo da senha).
   - A DEK fica "embrulhada" por cada senha de usuário e pela chave de recuperação (PBKDF2-SHA256 + AES-GCM).
   - A DEK só existe na memória, depois do login. Os cifrados ficam em docs_e/assets_e; a cópia sem cifra só some quando o administrador manda. */
var PBK=150000;
function b64u8(u8){var s='',n=0x8000;for(var i=0;i<u8.length;i+=n)s+=String.fromCharCode.apply(null,u8.subarray(i,i+n));return btoa(s)}
function u8b64(b){var s=atob(b),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
function pbkKey(secret,salt){
  return crypto.subtle.importKey('raw',enc.encode(secret),'PBKDF2',false,['deriveKey']).then(function(k){
    return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:salt,iterations:PBK},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  });
}
function aesEnc(key,u8,aad){
  var iv=crypto.getRandomValues(new Uint8Array(12));
  return crypto.subtle.encrypt({name:'AES-GCM',iv:iv,additionalData:aad},key,u8).then(function(ct){return{iv:iv,ct:ct}});
}
function aesDec(key,iv,ct,aad){return crypto.subtle.decrypt({name:'AES-GCM',iv:iv,additionalData:aad},key,ct)}
var AAD_WRAP=enc.encode('wrap'),AAD_CHK=enc.encode('chk');
function wrapRaw(raw,secret){
  var salt=crypto.getRandomValues(new Uint8Array(16));
  return pbkKey(secret,salt).then(function(k){return aesEnc(k,raw,AAD_WRAP)}).then(function(r){return{s:hex(salt),iv:hex(r.iv),w:hex(new Uint8Array(r.ct))}});
}
function unwrapRaw(w,secret){
  return pbkKey(secret,unhex(w.s)).then(function(k){return aesDec(k,unhex(w.iv),unhex(w.w),AAD_WRAP)}).then(function(b){return new Uint8Array(b)});
}
function setDek(raw){
  ENC.raw=raw;
  return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt']).then(function(k){ENC.key=k});
}
function checkDek(){
  var c=meta.enc&&meta.enc.chk;if(!c)return Promise.resolve();
  return aesDec(ENC.key,unhex(c.iv),unhex(c.c),AAD_CHK).then(function(b){if(new TextDecoder().decode(b)!=='ok')throw new Error('x')});
}
OFF.encEsquece=function(){ENC.raw=null;ENC.key=null};

/* ----- registros cifrados ----- */
function normDoc(r){return JSON.stringify({k:r.k||(r.col+'/'+r.id),col:r.col,id:r.id,data:r.data===undefined?null:r.data,u:r.u,d:r.d?1:0,by:r.by||''})}
function encDocRec(r){
  var k=r.k||(r.col+'/'+r.id);
  return aesEnc(ENC.key,enc.encode(normDoc(r)),enc.encode(k)).then(function(x){return{k:k,iv:x.iv,ct:x.ct}});
}
function decDocRec(x){
  return aesDec(ENC.key,x.iv,x.ct,enc.encode(x.k)).then(function(b){return JSON.parse(new TextDecoder().decode(b))});
}
function encAssetRec(r){
  var head=enc.encode(JSON.stringify({id:r.id,type:r.type||'',u:r.u,d:r.d?1:0,by:r.by||''}));
  var p=(r.blob&&!r.d)?r.blob.arrayBuffer():Promise.resolve(new ArrayBuffer(0));
  return p.then(function(buf){
    var out=new Uint8Array(4+head.length+buf.byteLength);
    new DataView(out.buffer).setUint32(0,head.length);out.set(head,4);out.set(new Uint8Array(buf),4+head.length);
    return aesEnc(ENC.key,out,enc.encode('asset/'+r.id));
  }).then(function(x){return{id:r.id,iv:x.iv,ct:x.ct}});
}
function decAssetRec(x){
  return aesDec(ENC.key,x.iv,x.ct,enc.encode('asset/'+x.id)).then(function(b){
    var u=new Uint8Array(b),hl=new DataView(b).getUint32(0);
    var h=JSON.parse(new TextDecoder().decode(u.subarray(4,4+hl)));
    var bytes=u.subarray(4+hl);
    return{id:h.id,type:h.type,u:h.u,d:h.d,by:h.by,blob:h.d?null:new Blob([bytes],{type:h.type||'image/jpeg'}),_bytes:bytes};
  });
}
OFF.encPutRoute=function(store,arr){
  var locked=uerr('Os dados estão protegidos. Entre com a senha para continuar.');
  if(store==='docs'){
    var plain=arr.filter(function(r){return r.col==='_users'}),rest=arr.filter(function(r){return r.col!=='_users'});
    if(rest.length&&!ENC.key)return Promise.reject(locked);
    return Promise.all(rest.map(encDocRec)).then(function(e){return idbPutRaw('docs_e',e)}).then(function(){return idbPutRaw('docs',plain)});
  }
  if(!ENC.key)return Promise.reject(locked);
  return Promise.all(arr.map(encAssetRec)).then(function(e){return idbPutRaw('assets_e',e)});
};
function rawClear(stores){
  return idbOpenE().then(function(db){return new Promise(function(res,rej){
    var t=db.transaction(stores,'readwrite');stores.forEach(function(s){t.objectStore(s).clear()});
    t.oncomplete=function(){res()};t.onerror=t.onabort=function(){rej(t.error)};
  })});
}
OFF.encLimpaDados=function(){
  var us=C._users;
  return rawClear(['docs_e','assets_e']).then(function(){C={};if(us)C._users=us});
};

/* ----- login: abre os dados com a senha do usuário ----- */
function carregaCifrados(){
  return Promise.all([idbAll('docs_e'),idbAll('assets_e')]).then(function(r){
    var falhas=0,cols={};
    return Promise.all(r[0].map(function(x){return decDocRec(x).then(function(o){return o},function(){falhas++;return null})})).then(function(docs){
      docs.forEach(function(o){if(!o)return;o.k=o.k||(o.col+'/'+o.id);(C[o.col]||(C[o.col]={}))[o.id]=o;cols[o.col]=1;if(o.u>lastU)lastU=o.u});
      return Promise.all(r[1].map(function(x){return decAssetRec(x).then(function(o){return o},function(){falhas++;return null})}));
    }).then(function(as){
      Object.keys(urls).forEach(function(k){URL.revokeObjectURL(urls[k])});urls={};A={};
      as.forEach(function(o){if(!o)return;delete o._bytes;A[o.id]=o;if(o.u>lastU)lastU=o.u;if(!o.d&&o.blob)urls[o.id]=URL.createObjectURL(o.blob)});
      OFF.encFalhas=falhas;
      Object.keys(cols).forEach(mark);
    });
  });
}
OFF.encUnlock=function(u,pwd){
  if(!ENC.on)return Promise.resolve();
  var w=meta.enc.wraps&&meta.enc.wraps[u.id];
  if(!w)return Promise.reject(uerr('Seu acesso aos dados ainda não foi liberado neste aparelho. Peça ao administrador para redefinir a sua senha.'));
  return unwrapRaw(w,pwd).then(setDek,function(){
    throw uerr('A senha confere com o login, mas não abre os dados deste aparelho (ela pode ter sido trocada em outro aparelho). Use "Esqueci a senha" com a chave de recuperação.');
  }).then(checkDek).then(carregaCifrados).then(function(){
    if(meta.snapPend){var m=meta.snapPend;delMeta('snapPend');OFF.snapshot(m)}
  });
};
OFF.encWrapUser=function(id,pwd){
  return wrapRaw(ENC.raw,pwd).then(function(w){
    var e=Object.assign({},meta.enc),ws=Object.assign({},e.wraps);ws[id]=w;e.wraps=ws;return setMeta('enc',e).then(function(){if(OFF.rerender)OFF.rerender()});
  });
};
OFF.encRecuperaInicio=function(keyNorm){
  if(!ENC.on)return Promise.resolve();
  return unwrapRaw(meta.enc.rec,keyNorm).then(setDek).then(checkDek).catch(function(){throw uerr('A chave de recuperação está certa, mas não abre os dados cifrados deste aparelho.')});
};

/* ----- cópias internas cifradas ----- */
OFF.encSnap=function(rec,docs){
  if(!ENC.key)return Promise.reject(uerr('Os dados estão protegidos.'));
  return aesEnc(ENC.key,enc.encode(JSON.stringify(docs)),enc.encode(rec.id)).then(function(x){return Object.assign(rec,{enc:1,iv:x.iv,ct:x.ct})});
};
OFF.encSnapAbre=function(rec){
  if(!ENC.key)return Promise.reject(uerr('Os dados estão protegidos. Entre com a senha.'));
  return aesDec(ENC.key,rec.iv,rec.ct,enc.encode(rec.id)).then(function(b){return Object.assign({},rec,{docs:JSON.parse(new TextDecoder().decode(b))})},function(){throw uerr('Esta cópia foi feita com outra chave e não pode ser aberta.')});
};

/* ----- arquivos de backup e pacotes: cifrados com uma senha do arquivo ----- */

var AAD_FILE=enc.encode('ctrl-file');
OFF.cifraArquivo=function(blob){
  return pedeSenhaArquivo(true,'Senha do arquivo').then(function(pwd){
    var salt=crypto.getRandomValues(new Uint8Array(16));
    return Promise.all([pbkKey(pwd,salt),blob.arrayBuffer()]).then(function(r){return aesEnc(r[0],new Uint8Array(r[1]),AAD_FILE)}).then(function(x){
      var head='{"fmt":"ctrl-alugueis-enc","pv":1,"kdf":"pbkdf2-sha256","it":'+PBK+',"s":"'+hex(salt)+'","iv":"'+hex(x.iv)+'","ct":"';
      return new Blob([head,b64u8(new Uint8Array(x.ct)),'"}'],{type:'application/json'});
    });
  });
};
OFF.abreArquivo=function(text){
  var j;try{j=JSON.parse(text)}catch(e){return Promise.reject(new Error('O arquivo cifrado está danificado.'))}
  if(j.fmt!=='ctrl-alugueis-enc'||!j.ct)return Promise.reject(new Error('O arquivo cifrado está danificado.'));
  return pedeSenhaArquivo(false,'Arquivo cifrado').then(function(pwd){
    return crypto.subtle.importKey('raw',enc.encode(pwd),'PBKDF2',false,['deriveKey']).then(function(k){
      return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:unhex(j.s),iterations:j.it||PBK},k,{name:'AES-GCM',length:256},false,['decrypt']);
    }).then(function(k){return aesDec(k,unhex(j.iv),u8b64(j.ct),AAD_FILE)}).then(function(b){return new TextDecoder().decode(b)},function(){throw new Error('Senha do arquivo incorreta, ou o arquivo está danificado.')});
  });
};

/* ----- ativar / desativar / apagar cópia / nova chave ----- */
function audCrip(acao,depois){
  return writeRec('auditoria',rid(10),{acao:acao,col:'(tudo)',quem:cur.id,nome:cur.nome,quando:Date.now(),aparelho:DEV(),depois:depois||{}},false,true);
}
function todosDocs(){var l=[];Object.keys(C).forEach(function(c){if(c==='_users')return;Object.keys(C[c]).forEach(function(i){l.push(C[c][i])})});return l}
function lotes(arr,n,fn){
  var p=Promise.resolve();
  for(var i=0;i<arr.length;i+=n)(function(part){p=p.then(function(){return fn(part)})})(arr.slice(i,i+n));
  return p;
}
function iguaisBytes(a,b){if(a.length!==b.length)return false;for(var i=0;i<a.length;i++)if(a[i]!==b[i])return false;return true}
/* cifra uma cópia ao lado da original, confere registro por registro e só então liga. Se algo falhar, nada muda. */
function encAtivar(pwd,key,prog){
  var norm=key.replace(/-/g,''),raw=crypto.getRandomValues(new Uint8Array(32)),docs=todosDocs(),assets=Object.keys(A).map(function(k){return A[k]}),novo;
  var falha=function(e){ENC.on=false;ENC.key=null;ENC.raw=null;return rawClear(['docs_e','assets_e']).then(function(){throw e})};
  return setDek(raw).then(function(){
    return Promise.all([wrapRaw(raw,pwd),wrapRaw(raw,norm),aesEnc(ENC.key,enc.encode('ok'),AAD_CHK)]);
  }).then(function(r){
    novo={v:1,on:true,wraps:{},rec:r[1],chk:{iv:hex(r[2].iv),c:hex(new Uint8Array(r[2].ct))},desde:Date.now(),copiaSemCifra:true};
    novo.wraps[cur.id]=r[0];
    return rawClear(['docs_e','assets_e']);
  }).then(function(){
    prog('Cifrando '+docs.length+' registros…');
    return lotes(docs,200,function(part){return Promise.all(part.map(encDocRec)).then(function(e){return idbPutRaw('docs_e',e)})});
  }).then(function(){
    prog('Cifrando '+assets.length+' fotos…');
    return lotes(assets,10,function(part){return Promise.all(part.map(encAssetRec)).then(function(e){return idbPutRaw('assets_e',e)})});
  }).then(function(){
    if(OFF.encTesteFalha)throw new Error('Falha simulada (somente em teste).');
    prog('Conferindo cada registro…');
    return Promise.all([idbAll('docs_e'),idbAll('assets_e')]);
  }).then(function(r){
    if(r[0].length!==docs.length||r[1].length!==assets.length)throw new Error('A conferência falhou: a quantidade de registros cifrados não bate com a original. Nada foi alterado.');
    var mapa={};docs.forEach(function(d){mapa[d.k||(d.col+'/'+d.id)]=d});
    return Promise.all(r[0].map(function(x){return decDocRec(x).then(function(o){var orig=mapa[x.k];if(!orig||normDoc(o)!==normDoc(orig))throw new Error('A conferência falhou no registro '+x.k+'. Nada foi alterado.')})})).then(function(){
      var am={};assets.forEach(function(a){am[a.id]=a});
      return Promise.all(r[1].map(function(x){return decAssetRec(x).then(function(o){
        var orig=am[x.id];if(!orig)throw new Error('A conferência falhou em uma foto. Nada foi alterado.');
        if(o.d!==(orig.d?1:0)||(o.type||'')!==(orig.type||''))throw new Error('A conferência falhou em uma foto. Nada foi alterado.');
        if(orig.d||!orig.blob)return;
        return orig.blob.arrayBuffer().then(function(b){if(!iguaisBytes(new Uint8Array(b),o._bytes))throw new Error('A conferência falhou em uma foto. Nada foi alterado.')});
      })}));
    });
  }).then(function(){
    prog('Ligando a criptografia…');
    var salt=rid(8);
    return sha256hex(salt+':'+norm).then(function(h){return Promise.all([setMeta('recSalt',salt),setMeta('recHash',h)])}).then(function(){return setMeta('enc',novo)});
  }).then(function(){ENC.on=true;return audCrip('crip-ativar',{registros:docs.length,fotos:assets.length})}).catch(falha);
}

            modal('Criptografia ativada','<p style="margin:0 0 8px">Tudo foi cifrado e conferido registro por registro.</p><div class="notice" style="margin-bottom:8px"><strong>A cópia sem cifra ainda está neste aparelho.</strong> Use o sistema por alguns dias para ter certeza de que está tudo certo e depois apague essa cópia em Ajustes &gt; Segurança. Enquanto ela existir, a proteção ainda não vale.</div><p class="hint" style="margin:0">Se houver outros usuários, redefina a senha de cada um para liberar o acesso deles.</p>',{submit:null,cancel:'Fechar'});
            if(OFF.rerender)OFF.rerender();
          },function(e){pr.close();modal('Não foi possível ativar','<p style="margin:0">'+esc(e.message)+'</p><p class="hint" style="margin-top:8px">Seus dados continuam como estavam, sem alteração.</p>',{submit:null,cancel:'Fechar'})});
          return false;
        });
        return false;
      });
    }});
}
function encDesativar(pwd){
  var docs=todosDocs(),assets=Object.keys(A).map(function(k){return A[k]});
  return lotes(docs,300,function(p){return idbPutRaw('docs',p)}).then(function(){return lotes(assets,20,function(p){return idbPutRaw('assets',p)})}).then(function(){
    return idbAll('docs').then(function(r){
      var n=r.filter(function(x){return x.col!=='_users'}).length;
      if(n<docs.length)throw new Error('A conferência falhou: a cópia sem cifra está incompleta. Nada foi alterado.');
    });
  }).then(function(){
    return snapAll().then(function(all){
      return Promise.all(all.filter(function(s){return s.enc}).map(function(s){return OFF.encSnapAbre(s).then(function(r){return{id:r.id,quando:r.quando,motivo:r.motivo,ver:r.ver,n:r.n,docs:r.docs}},function(){return null})})).then(function(plain){
        plain=plain.filter(Boolean);
        return snapDb().then(function(db){return new Promise(function(res){var t=db.transaction('s','readwrite');plain.forEach(function(r){t.objectStore('s').put(r)});all.filter(function(s){return s.enc}).forEach(function(s){if(!plain.some(function(p){return p.id===s.id}))t.objectStore('s').delete(s.id)});t.oncomplete=function(){res()};t.onerror=function(){res()}})});
      });
    });
  }).then(function(){
    var chave=ENC.key;
    return delMeta('enc').then(function(){ENC.on=false;ENC.raw=null;ENC.key=null;return rawClear(['docs_e','assets_e'])});
  }).then(function(){return audCrip('crip-desativar',{})});   /* depois de desligar, para o registro ficar no armazenamento normal */
}
function encApagarCopia(){
  return idbAll('docs').then(function(r){
    var ks=r.filter(function(x){return x.col!=='_users'}).map(function(x){return x.k});
    return idbOpen().then(function(db){return new Promise(function(res,rej){
      var t=db.transaction(['docs','assets'],'readwrite');
      ks.forEach(function(k){t.objectStore('docs').delete(k)});
      t.objectStore('assets').clear();
      t.oncomplete=function(){res()};t.onerror=t.onabort=function(){rej(t.error)};
    })});
  }).then(function(){
    return snapAll().then(function(all){
      return snapDb().then(function(db){return new Promise(function(res){var t=db.transaction('s','readwrite');all.filter(function(s){return!s.enc}).forEach(function(s){t.objectStore('s').delete(s.id)});t.oncomplete=function(){res()};t.onerror=function(){res()}})});
    });
  }).then(function(){var e=Object.assign({},meta.enc,{copiaSemCifra:false,apagadaEm:Date.now()});return setMeta('enc',e)}).then(function(){return audCrip('crip-apagar-copia',{})});
}
function encNovaChave(pwd){
  var key=genKey(),norm=key.replace(/-/g,'');
  return new Promise(function(res,rej){
    mostraChave(key,'Nova chave de recuperação','A chave anterior <strong>deixa de valer</strong> assim que você confirmar. Anote esta nova.',function(a){
      return wrapRaw(ENC.raw,norm).then(function(w){
        var salt=rid(8);
        return sha256hex(salt+':'+norm).then(function(h){return Promise.all([setMeta('recSalt',salt),setMeta('recHash',h)])}).then(function(){return setMeta('enc',Object.assign({},meta.enc,{rec:w}))}).then(function(){return audCrip('crip-chave',{})});
      }).then(function(){a.close();res();return false});
    });
  });
}
OFF.encClique=function(a){
  if(a==='enc-ativar')encAtivarDialog();
  else if(a==='enc-desativar')pedeSenhaAdmin('Desativar a criptografia','Os dados voltam a ficar guardados <strong>sem cifra</strong> neste aparelho. Os backups que você já fez cifrados continuam precisando da senha do arquivo.','Desativar',true,function(pwd,ap){
    var pr=progressoDialog('Desativando');ap.close();
    encDesativar(pwd).then(function(){pr.close();toast('Criptografia desativada.');if(OFF.rerender)OFF.rerender()},function(e){pr.close();toast(e.message)});
    return false;
  });
  else if(a==='enc-apagar')pedeSenhaAdmin('Apagar a cópia sem cifra','Isto apaga <strong>de vez</strong> a cópia sem cifra dos dados e das fotos que ainda está neste aparelho (e as cópias internas antigas). Só continue se você já conferiu que tudo abre normalmente. Depois disso, só a versão cifrada existe.','Apagar a cópia',true,function(pwd,ap){
    return encApagarCopia().then(function(){ap.close();toast('Cópia sem cifra apagada.');if(OFF.rerender)OFF.rerender();return false});
  });
  else if(a==='enc-chave')pedeSenhaAdmin('Gerar nova chave de recuperação','A chave atual deixa de valer. Você verá a nova na próxima tela.','Continuar',false,function(pwd,ap){
    ap.close();encNovaChave(pwd).then(function(){toast('Nova chave de recuperação ativada.');if(OFF.rerender)OFF.rerender()});
    return false;
  });
};

};
