/* Layout: cabeçalho fixo com abas; conteúdo em coluna única de até 1080px; listas em linhas que quebram no celular. */
:root{
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --bg:#EDF0F5; --surface:#FFFFFF; --ink:#101B2B; --muted:#58657A; --line:#D8DEE8;
  --accent:#2347C5; --accent-ink:#FFFFFF; --accent-soft:#E3E9FB; --bar:#BAC7F0;
  --good:#16704A; --good-soft:#DAF0E5; --warn:#8F5A08; --warn-soft:#FAEBC8; --bad:#B3261E; --bad-soft:#FBE2DF;
  --shadow:0 12px 40px rgba(16,27,43,.18); --scrim:rgba(16,27,43,.5);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C121D; --surface:#141C2A; --ink:#E8EDF5; --muted:#93A1B6; --line:#26324A;
    --accent:#8BA3F7; --accent-ink:#0C1220; --accent-soft:#1B2646; --bar:#34477F;
    --good:#4CC38A; --good-soft:#11301F; --warn:#E3AE4D; --warn-soft:#32260C; --bad:#F2857B; --bad-soft:#3A1714;
    --shadow:0 12px 40px rgba(0,0,0,.55); --scrim:rgba(0,0,0,.65);
    color-scheme:dark;
  }
}

/* ---------- regras de cobrança ---------- */
function mensalDues(a,limit){
  var dv=Math.min(31,Math.max(1,Number(a.diaVenc)||1));
  var p=a.inicio.split('-').map(Number),y=p[0],m=p[1];
  var due=y+'-'+pad(m)+'-'+pad(Math.min(dv,lastDay(y,m)));
  if(d2n(due)<d2n(a.inicio)){m++;if(m>12){m=1;y++}due=y+'-'+pad(m)+'-'+pad(Math.min(dv,lastDay(y,m)))}
  var out=[],guard=0;
  while(d2n(due)<=d2n(limit)&&guard++<240){
    out.push({ref:due.slice(0,7),venc:due});
    m++;if(m>12){m=1;y++}
    due=y+'-'+pad(m)+'-'+pad(Math.min(dv,lastDay(y,m)));
  }
  return out;
}
function rowsFor(a,t){
  var pays=state.pagamentos.filter(function(p){return p.aluguelId===a.id});
  var list=[];
  if(a.modalidade==='mes'){
    var limit=a.encerradoEm?a.encerradoEm:addDays(t,7);
    list=mensalDues(a,limit).map(function(x){return{ref:x.ref,venc:x.venc,valor:Number(a.valorUnit)||0}});
  }else{
    var fim=a.fim||a.inicio;
    var ef=a.devolucao&&a.devolucao>fim?a.devolucao:fim;
    var dias=Math.max(1,d2n(ef)-d2n(a.inicio));
    list=[{ref:'total',venc:ef,valor:(Number(a.valorUnit)||0)*dias,dias:dias}];
  }
  return list.map(function(r){
    var pago=sumBy(pays.filter(function(p){return p.ref===r.ref}),function(p){return p.valor});
    var saldo=Math.max(0,Math.round((r.valor-pago)*100)/100);
    var delta=d2n(r.venc)-d2n(t),status;
    if(saldo<=0)status='pago';else if(delta<0)status='atrasado';else if(delta===0)status='hoje';else status='aberto';
    var multa=0,juros=0,atraso=-delta;
    if(status==='atrasado'&&atraso>(Number(cfg.carencia)||0)){
      multa=Math.round(saldo*(Number(cfg.multa)||0))/100;
      juros=Math.round(saldo*(Number(cfg.juros)||0)/30*atraso)/100;
    }
    var enc=Math.round((multa+juros)*100)/100;
    return{ref:r.ref,venc:r.venc,valor:r.valor,dias:r.dias,aluguelId:a.id,a:a,pago:pago,saldo:saldo,status:status,delta:delta,multa:multa,juros:juros,enc:enc,total:Math.round((saldo+enc)*100)/100};
  });
}
function compute(){
  var t=todayStr(),lim=addDays(t,7);
  var cli={},itm={};
  state.clientes.forEach(function(c){cli[c.id]=c});
  state.itens.forEach(function(i){itm[i.id]=i});
  var byAl={},rows=[];
  state.alugueis.forEach(function(a){
    if(!a.inicio){byAl[a.id]=[];return}
    var r=rowsFor(a,t);byAl[a.id]=r;rows=rows.concat(r);
  });
  var open=rows.filter(function(r){return r.status!=='pago'}).sort(function(x,y){return x.venc<y.venc?-1:x.venc>y.venc?1:0});
  var late=open.filter(function(r){return r.status==='atrasado'});
  var soon=open.filter(function(r){return r.status!=='atrasado'&&r.venc<=lim});
  var mes=t.slice(0,7);
  var recebidoMes=sumBy(state.pagamentos.filter(function(p){return(p.data||'').slice(0,7)===mes}),function(p){return p.valor});
  var nPagMes=state.pagamentos.filter(function(p){return(p.data||'').slice(0,7)===mes}).length;
  var ativos=state.alugueis.filter(function(a){return a.status!=='encerrado'});
  var equip=state.itens.filter(function(i){return i.tipo!=='assinatura'});
  var ids={};ativos.forEach(function(a){ids[a.itemId]=true});
  var equipAlugados=equip.filter(function(i){return ids[i.id]});
  var hasEx=[].concat(state.clientes,state.itens,state.alugueis,state.pagamentos,state.despesas,state.despPag).some(function(x){return x.exemplo});
  var dr=despRowsAll(t),dOpen=dr.filter(function(r){return r.status!=='pago'}).sort(function(x,y){return x.venc<y.venc?-1:x.venc>y.venc?1:0});
  var dLate=dOpen.filter(function(r){return r.status==='atrasado'});
  var dSoon=dOpen.filter(function(r){return r.status!=='atrasado'&&r.venc<=lim});
  var assMap={};state.assDig.forEach(function(x){assMap[x.id]=x});
  return{t:t,lim:lim,cli:cli,itm:itm,byAl:byAl,rows:rows,open:open,late:late,soon:soon,recebidoMes:recebidoMes,nPagMes:nPagMes,dr:dr,dOpen:dOpen,dLate:dLate,dSoon:dSoon,assMap:assMap,
    ativos:ativos,equip:equip,equipAlugados:equipAlugados,hasEx:hasEx,
    aReceber:sumBy(open,function(r){return r.total}),atrasoValor:sumBy(late,function(r){return r.total})};
}
function alStatus(a){
  var r=D.byAl[a.id]||[];
  var saldo=sumBy(r,function(x){return x.saldo});
  var late=r.some(function(x){return x.status==='atrasado'});
  if(a.status==='encerrado')return saldo>0?{k:'warn',t:'Encerrado com saldo'}:{k:'mute',t:'Encerrado'};
  if(late)return{k:'bad',t:'Em atraso'};
  if(a.modalidade!=='mes'&&(a.fim||a.inicio)<D.t)return{k:'warn',t:'Devolução pendente'};
  return{k:'good',t:'Em dia'};
}

var modalOnSubmit=null,lastFocus=null;
function openModal(title,body,o){
  o=o||{};

  var submit=o.submit===null?'':'<button type="submit" class="btn '+(o.danger?'danger solid':'primary')+'" id="m-ok">'+esc(o.submit||'Salvar')+'</button>';

function closeModal(){
  modalEl.hidden=true;modalEl.innerHTML='';modalOnSubmit=null;
  if(lastFocus&&lastFocus.focus&&document.contains(lastFocus)){try{lastFocus.focus()}catch(e){}}
}
modalEl.addEventListener('submit',function(e){
  e.preventDefault();
  var form=e.target,fn=modalOnSubmit;
  if(!fn)return;
  var ok=document.getElementById('m-ok'),err=document.getElementById('m-err');
  err.hidden=true;if(ok)ok.disabled=true;
  Promise.resolve().then(function(){return fn(form)}).then(function(){closeModal()},function(ex){
    err.textContent=(ex&&ex.message)||'Não foi possível concluir.';err.hidden=false;if(ok)ok.disabled=false;
  });
});
modalEl.addEventListener('mousedown',function(e){if(e.target===modalEl)closeModal()});

function dbErr(e){
  var c=e&&e.code;
  if(c==='invalid_argument')return'Não foi possível salvar. Confira se você tem permissão de edição neste artefato.';
  if(c==='quota_exceeded')return'O limite de armazenamento foi atingido. Apague registros que não usa mais.';
  if(c==='resource_exhausted'||c==='unavailable')return'O servidor está ocupado. Tente de novo em instantes.';
  if(c==='revoked')return'Seu acesso mudou. Recarregue a página.';
  return(e&&e.message)||'Erro ao salvar.';
}
function w(fn){
  return Promise.resolve().then(fn).catch(function(e){throw new Error(e instanceof Error&&!e.code?e.message:dbErr(e))});
}

var pendingFoto=null;
function shrink(file){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      var k=Math.min(1,1280/Math.max(img.naturalWidth,img.naturalHeight)),wd=Math.round(img.naturalWidth*k),ht=Math.round(img.naturalHeight*k);
      var cv=document.createElement('canvas');cv.width=wd;cv.height=ht;
      cv.getContext('2d').drawImage(img,0,0,wd,ht);URL.revokeObjectURL(url);
      cv.toBlob(function(b){b?res(b):rej(new Error('Não foi possível preparar a foto.'))},'image/jpeg',0.82);
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('Não foi possível ler esta imagem.'))};
    img.src=url;
  });
}
function upErr(e){

  if(c==='not_granted'||c==='capability_disabled'||c==='capability_removed')return'Seu acesso não permite enviar fotos.';
  return(e&&e.message)||'Não foi possível enviar a foto.';

/* ---------- assinatura na tela ---------- */
function makePad(cv){
  var ctx=cv.getContext('2d'),drawing=false,ink=false,last=null;
  ctx.lineWidth=2.6;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#111';
  function pos(e){var r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}}
  cv.addEventListener('pointerdown',function(e){
    drawing=true;last=pos(e);
    try{cv.setPointerCapture(e.pointerId)}catch(x){}
    ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(last.x+0.1,last.y+0.1);ctx.stroke();ink=true;e.preventDefault();
  });
  cv.addEventListener('pointermove',function(e){
    if(!drawing)return;
    var p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;e.preventDefault();
  });
  ['pointerup','pointercancel'].forEach(function(n){cv.addEventListener(n,function(){drawing=false})});
  return{
    clear:function(){ctx.clearRect(0,0,cv.width,cv.height);ink=false},
    has:function(){return ink},
    data:function(){return cv.toDataURL('image/png')},
    load:function(src){
      var im=new Image();
      im.onload=function(){
        ctx.clearRect(0,0,cv.width,cv.height);
        var k=Math.min(cv.width/im.width,cv.height/im.height),w2=im.width*k,h2=im.height*k;
        ctx.drawImage(im,(cv.width-w2)/2,(cv.height-h2)/2,w2,h2);ink=true;
      };
      im.src=src;
    }
  };
}
function sha256(text){
  try{
    return crypto.subtle.digest('SHA-256',new TextEncoder().encode(text)).then(function(h){
      return Array.prototype.map.call(new Uint8Array(h),function(b){return b.toString(16).padStart(2,'0')}).join('');
    });
  }catch(e){return Promise.resolve('')}
}

var CATS=['Aluguel do ponto','Energia','Água','Internet e telefone','Peças e equipamentos','Manutenção','Impostos e taxas','Salários e retiradas','Marketing','Outros'];
var RECS=[['unica','Uma vez'],['semanal','Toda semana'],['mensal','Todo mês'],['anual','Todo ano']];
function recTxt(d){
  var r=d.recorrencia||'unica';
  if(r==='mensal')return'Todo mês, dia '+Number((d.vencimento||'').slice(8));
  if(r==='semanal')return'Toda semana';
  if(r==='anual')return'Todo ano, '+fmtShort(d.vencimento);
  return'Uma vez';
}
function despDates(d,limit){
  var out=[],start=d.vencimento,rec=d.recorrencia||'unica';
  if(!start)return out;
  if(rec==='unica'){if(start<=limit)out.push(start);return out}
  var floor=d.criadoEm?addDays(ymd(new Date(d.criadoEm)),-31):'0000-00-00';
  var end=d.fim&&d.fim<limit?d.fim:limit;
  var p=start.split('-').map(Number),y=p[0],m=p[1],dd=p[2],cur=start,k=0,guard=0;
  while(cur<=end&&guard++<600){
    if(cur>=floor)out.push(cur);
    k++;
    if(rec==='semanal')cur=addDays(start,7*k);
    else if(rec==='mensal'){var mm=m-1+k,yy=y+Math.floor(mm/12);mm=mm%12+1;cur=yy+'-'+pad(mm)+'-'+pad(Math.min(dd,lastDay(yy,mm)))}
    else{var y2=y+k;cur=y2+'-'+pad(m)+'-'+pad(Math.min(dd,lastDay(y2,m)))}
  }
  return out;
}
function despRowsAll(t){
  var limit=addDays(t,30),rows=[];
  state.despesas.forEach(function(d){
    var pays=state.despPag.filter(function(p){return p.despesaId===d.id});
    despDates(d,limit).forEach(function(venc){
      var pg=pays.filter(function(p){return p.ref===venc});
      var delta=d2n(venc)-d2n(t);
      rows.push({d:d,ref:venc,venc:venc,valor:Number(d.valor)||0,pago:sumBy(pg,function(p){return p.valor}),status:pg.length?'pago':delta<0?'atrasado':delta===0?'hoje':'aberto',delta:delta});
    });
  });
  return rows;
}
function pillDesp(r){
  if(r.status==='pago')return'<span class="pill good">Paga</span>';
  if(r.status==='atrasado')return'<span class="pill bad">Atrasada '+(-r.delta)+' d</span>';
  if(r.status==='hoje')return'<span class="pill warn">Vence hoje</span>';
  return'<span class="pill '+(r.delta<=7?'warn':'info')+'">'+(r.delta===1?'Vence amanhã':'Vence em '+r.delta+' d')+'</span>';
}
function gcalHref(d,venc){

  var det='Valor previsto: '+money(d.valor)+(d.fornecedor?'\nFornecedor: '+d.fornecedor:'')+(d.categoria?'\nCategoria: '+d.categoria:'');
  var u='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+e('Pagar: '+d.descricao)+'&dates='+ds+'/'+de+'&details='+e(det);

/* ---------- relatório mensal ---------- */
function mesLabel(m){var p=m.split('-');return MESES_L[Number(p[1])-1]+' de '+p[0]}
function moveMes(m,k){var p=m.split('-').map(Number),x=p[0]*12+p[1]-1+k;return Math.floor(x/12)+'-'+pad(x%12+1)}
function relData(mes){
  var cmp=function(a,b){return String(a.data).localeCompare(String(b.data))||(a.criadoEm||0)-(b.criadoEm||0)};
  var pags=state.pagamentos.filter(function(p){return(p.data||'').slice(0,7)===mes}).sort(cmp);
  var dps=state.despPag.filter(function(p){return(p.data||'').slice(0,7)===mes}).sort(cmp);
  var porForma={},porTipo={},porItem={},porCat={};
  pags.forEach(function(p){
    var a=state.alugueis.find(function(x){return x.id===p.aluguelId}),it=a?D.itm[a.itemId]:null,v=Number(p.valor)||0;
    var f=p.forma||'Outro';porForma[f]=(porForma[f]||0)+v;
    var tp=it?(it.tipo==='assinatura'?'Assinaturas':'Equipamentos'):'Outros';porTipo[tp]=(porTipo[tp]||0)+v;
    var nm=it?it.nome:'Item removido';porItem[nm]=(porItem[nm]||0)+v;
  });
  dps.forEach(function(p){
    var d=state.despesas.find(function(x){return x.id===p.despesaId}),c=d?(d.categoria||'Sem categoria'):'Despesa removida';
    porCat[c]=(porCat[c]||0)+(Number(p.valor)||0);
  });
  var comp=D.rows.filter(function(r){return r.venc.slice(0,7)===mes});
  var tot=sumBy(pags,function(p){return p.valor}),dtot=sumBy(dps,function(p){return p.valor});
  return{mes:mes,pags:pags,dps:dps,total:tot,enc:sumBy(pags,function(p){return p.encargos}),despTotal:dtot,resultado:tot-dtot,
    porForma:porForma,porTipo:porTipo,porItem:porItem,porCat:porCat,
    prevTotal:sumBy(state.pagamentos.filter(function(p){return(p.data||'').slice(0,7)===moveMes(mes,-1)}),function(p){return p.valor}),
    previsto:sumBy(comp,function(r){return r.valor}),pagoComp:sumBy(comp,function(r){return Math.min(r.pago,r.valor)}),nAbertos:comp.filter(function(r){return r.status!=='pago'}).length,saldoComp:sumBy(comp,function(r){return r.saldo})};
}
function hbars(obj,limit){
  var arr=Object.keys(obj).map(function(k){return{l:k,v:obj[k]}}).sort(function(a,b){return b.v-a.v}).slice(0,limit||8);
  if(!arr.length)return'<div class="sumline">Sem dados neste mês.</div>';
  var max=Math.max.apply(null,arr.map(function(x){return x.v}))||1;
  return'<div style="padding-bottom:8px">'+arr.map(function(x){return'<div class="hb"><div class="l">'+esc(x.l)+'</div><div class="t"><i style="width:'+Math.max(2,Math.round(x.v/max*100))+'%"></i></div><div class="v">'+money(x.v)+'</div></div>'}).join('')+'</div>';
}

function csvCell(v){v=String(v==null?'':v);return/[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function csvNum(n){return(Number(n)||0).toFixed(2).replace('.',',')}
function relCsv(R){
  var lines=[['Data','Cliente','Item','Referência','Forma','Valor','Multa e juros'].join(';')];
  R.pags.forEach(function(p){
    var a=state.alugueis.find(function(x){return x.id===p.aluguelId});
    lines.push([fmtDate(p.data),a?nomeCli(a.clienteId):'Aluguel removido',a?nomeItem(a.itemId):'',p.ref&&p.ref!=='total'?p.ref:'',p.forma||'',csvNum(p.valor),csvNum(p.encargos)].map(csvCell).join(';'));
  });
  lines.push(['Total','','','','',csvNum(R.total),csvNum(R.enc)].map(csvCell).join(';'));
  return'﻿'+lines.join('\r\n');
}

/* ===== Pacotes: backup, sincronização por arquivo ===== */
function parsePkg(text){
  var p;
  try{p=JSON.parse(text)}catch(e){throw new Error('O arquivo não é um pacote deste sistema.')}
  if(!p||p.fmt!=='ctrl-alugueis'||!Array.isArray(p.docs))throw new Error('O arquivo não é um pacote deste sistema.');
  if((p.pv||1)>1)throw new Error('Este arquivo vem de uma versão mais nova do sistema. Atualize este aparelho primeiro.');
  return p;
}
function blobB64(b){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){var s=String(r.result);res(s.slice(s.indexOf(',')+1))};r.onerror=function(){rej(new Error('Falha ao ler uma foto.'))};r.readAsDataURL(b)})}
function b64Blob(b64,type){var s=atob(b64),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return new Blob([u],{type:type||'image/jpeg'})}

function buildPkg(kind,withPhotos){
  var docs=[];
  Object.keys(C).forEach(function(c){Object.keys(C[c]).forEach(function(id){var r=C[c][id];docs.push({col:r.col,id:r.id,data:r.data,u:r.u,d:r.d?1:0,by:r.by||''})})});
  var list=Object.keys(A).map(function(k){return A[k]});
  return Promise.all(list.map(function(r){
    if(r.d)return{id:r.id,type:r.type,u:r.u,d:1,by:r.by||''};
    if(!withPhotos||!r.blob)return null;
    return blobB64(r.blob).then(function(b){return{id:r.id,type:r.type,u:r.u,d:0,by:r.by||'',b64:b}});
  })).then(function(as){
    var pkg={fmt:'ctrl-alugueis',pv:1,app:VER,kind:kind,grupo:meta.grupo,empresa:meta.empresa||'',de:{dev:meta.dev,nome:meta.devNome,modo:meta.modo},quando:new Date().toISOString(),fotos:!!withPhotos,docs:docs,assets:as.filter(Boolean)};
    return new Blob([JSON.stringify(pkg)],{type:'application/json'});
  });
}
function wins(a,b){
  if(!b)return true;
  if(a.u!==b.u)return a.u>b.u;
  return String(a.by||'')>String(b.by||'');
}
function mergePkg(pkg){
  var st={novos:0,atual:0,removidos:0,iguais:0,futuros:0};
  var put=[],cols={},lim=Date.now()+86400000,i;
  pkg.docs.forEach(function(r){
    if(!r||typeof r.col!=='string'||typeof r.id!=='string'||typeof r.u!=='number')return;
    var loc=(C[r.col]||{})[r.id],rec={k:r.col+'/'+r.id,col:r.col,id:r.id,data:r.d?null:r.data,u:r.u,d:r.d?1:0,by:r.by||''};
    if(r.u>lim)st.futuros++;
    if(!wins(rec,loc)){st.iguais++;return}
    if(rec.d){if(loc&&!loc.d)st.removidos++}
    else if(!loc||loc.d)st.novos++;else st.atual++;
    put.push(rec);
  });
  var aput=[],pend=[];
  (pkg.assets||[]).forEach(function(a){
    if(!a||typeof a.id!=='string')return;
    var loc=A[a.id],rec={id:a.id,type:a.type,u:a.u||0,d:a.d?1:0,by:a.by||''};
    if(!wins(rec,loc))return;
    if(rec.d){rec.blob=null;aput.push(rec)}
    else if(a.b64){rec.blob=b64Blob(a.b64,a.type);aput.push(rec)}
  });
  return idbPut('docs',put).then(function(){return idbPut('assets',aput)}).then(function(){
    put.forEach(function(r){(C[r.col]||(C[r.col]={}))[r.id]=r;cols[r.col]=1;if(r.u>lastU)lastU=r.u});
    aput.forEach(function(r){
      A[r.id]=r;if(r.u>lastU)lastU=r.u;
      if(urls[r.id]){URL.revokeObjectURL(urls[r.id]);delete urls[r.id]}
      if(!r.d&&r.blob)urls[r.id]=URL.createObjectURL(r.blob);
    });
    Object.keys(cols).forEach(mark);
    st.fotos=aput.filter(function(r){return!r.d}).length;
    return st;
  });
}
function restorePkg(pkg){
  return idbClear(['docs','assets']).then(function(){
    C={};Object.keys(urls).forEach(function(k){URL.revokeObjectURL(urls[k])});A={};urls={};
    return mergePkg(pkg);
  }).then(function(st){return setMeta('grupo',pkg.grupo||rid(8)).then(function(){return st})});
}

/* ===== Atualização do sistema (GitHub ou arquivo local) ===== */
function bootDb(){
  return new Promise(function(res,rej){
    var r=indexedDB.open('ctrl_boot',1);
    r.onupgradeneeded=function(){r.result.createObjectStore('b')};
    r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)};
  });
}
function lsOk(){try{localStorage.setItem('ctrl_t','1');localStorage.removeItem('ctrl_t');return true}catch(e){return false}}
function getBundleInfo(){
  return bootDb().then(function(db){return new Promise(function(res){
    var g=db.transaction('b').objectStore('b').get('bundle');
    g.onsuccess=function(){res(g.result||null)};g.onerror=function(){res(null)};
  })}).catch(function(){return null});
}
function saveBundle(html,ver,origem,sha){
  if(!lsOk())return Promise.reject(new Error('Este navegador não permite guardar a atualização.'));
  return bootDb().then(function(db){return new Promise(function(res,rej){
    var t=db.transaction('b','readwrite');
    t.objectStore('b').put({versao:ver,html:html,sha:sha||'',origem:origem,quando:Date.now()},'bundle');
    t.oncomplete=function(){res()};t.onerror=t.onabort=function(){rej(t.error||new Error('Não foi possível guardar a atualização.'))};
  })}).then(function(){
    localStorage.setItem('ctrl_bundle',ver);localStorage.removeItem('ctrl_boot_try');localStorage.removeItem('ctrl_boot_fail');
  });
}
function validateBundle(html){
  if(typeof html!=='string'||html.length<150000)throw new Error('O arquivo não parece ser uma versão completa do sistema.');
  if(html.indexOf('name="ctrl-alugueis-app"')<0||html.indexOf('__Q.push')<0)throw new Error('Este arquivo não é uma versão do Controle de Aluguéis.');
  var m=/<meta name="app-versao" content="(\d+\.\d+\.\d+)">/.exec(html);
  if(!m)throw new Error('O arquivo não informa a versão.');
  return m[1];
}
function repoCfg(){var u=meta.upd||{};return{repo:u.repo||window.__DEFAULT_REPO||'',branch:u.branch||'main'}}
function normRepo(s){
  s=String(s||'').trim();
  var m=/github\.com\/([\w.-]+)\/([\w.-]+?)(?:\.git)?(?:[\/#?].*)?$/i.exec(s);
  if(m)return m[1]+'/'+m[2];
  m=/^([\w.-]+)\/([\w.-]+)$/.exec(s);
  return m?m[1]+'/'+m[2]:'';
}
function rawBase(){var r=repoCfg();return r.repo?'https://raw.githubusercontent.com/'+r.repo+'/'+r.branch+'/':null}
function checkUpdate(){
  var b=rawBase();
  if(!b)return Promise.reject(new Error('Informe primeiro o repositório do GitHub onde ficam as atualizações.'));
  return fetch(b+'versao.json?_='+Date.now(),{cache:'no-store'}).then(function(r){
    if(!r.ok)throw new Error(r.status===404?'Não encontrei o arquivo versao.json neste repositório.':'O GitHub respondeu com erro '+r.status+'.');
    return r.json();
  },function(){throw new Error('Sem acesso à internet agora.')}).then(function(j){
    if(!j||!/^\d+\.\d+\.\d+$/.test(j.versao||'')||typeof j.arquivo!=='string'||/\.\.|^\/|:/.test(j.arquivo)||!/^[0-9a-f]{64}$/.test(j.sha256||''))throw new Error('O arquivo versao.json está incompleto.');
    return j;
  }).then(function(j){return setMeta('updCheck',Date.now()).then(function(){return j})});
}
function installOnline(info){
  var b=rawBase();
  return fetch(b+info.arquivo+'?_='+Date.now(),{cache:'no-store'}).then(function(r){
    if(!r.ok)throw new Error('Não consegui baixar a atualização ('+r.status+').');
    return r.arrayBuffer();
  },function(){throw new Error('A conexão caiu durante o download.')}).then(function(buf){
    return sha256hex(buf).then(function(h){
      if(h!==info.sha256)throw new Error('O arquivo baixado não confere com o esperado (código SHA-256 diferente). Nada foi instalado.');
      var html=new TextDecoder('utf-8').decode(buf),v=validateBundle(html);
      if(v!==info.versao)throw new Error('A versão do arquivo ('+v+') não bate com a anunciada ('+info.versao+').');
      return saveBundle(html,v,'github:'+repoCfg().repo,h).then(function(){return v});
    });
  });
}
function installFile(){
  return pickFile('.html,text/html').then(function(f){
    if(!f)return null;
    return readText(f).then(function(html){
      var v=validateBundle(html),base=window.__BUILTIN||VER;
      if(cmpVer(v,base)<=0)throw new Error('A versão '+v+' não é mais nova que a de fábrica deste aparelho ('+base+'). Para voltar a uma versão antiga, use “Voltar à versão de fábrica”.');
      var go=cmpVer(v,VER)===0?confirmBox('Mesma versão','Esta é a versão '+v+', que já está em uso. Instalar de novo?','Instalar'):cmpVer(v,VER)<0?confirmBox('Versão anterior','A versão '+v+' é mais antiga que a atual ('+VER+'). Instalar mesmo assim?','Instalar',true):Promise.resolve(true);
      return go.then(function(ok){if(!ok)return null;return sha256hex(html).then(function(h){return saveBundle(html,v,'arquivo local',h)}).then(function(){return v})});
    });
  });
}
function reiniciar(v){
  confirmBox('Atualização pronta','A versão '+v+' foi instalada. Reiniciar agora para usar? Seus dados não mudam.','Reiniciar agora').then(function(ok){if(ok)location.reload()});
}
function fabrica(){
  confirmBox('Voltar à versão de fábrica','O sistema volta para a versão que veio no instalador. <strong>Seus dados não são apagados.</strong>','Voltar à versão de fábrica',true).then(function(ok){
    if(!ok)return;
    if(window.__fabrica)window.__fabrica();
    toast('Reiniciando…');setTimeout(function(){location.reload()},700);
  });

      '<p class="hint">Atualizar não mexe nos dados. Se a nova versão falhar ao abrir, o sistema volta sozinho para a anterior.</p>';
    var api=modal('Atualização do sistema',body,{submit:null,cancel:'Fechar',wide:true,
      left:'<button type="button" class="btn" data-o="chk">Verificar na internet</button><button type="button" class="btn" data-o="file">Usar um arquivo…</button><button type="button" class="btn" data-o="repo">Repositório…</button>'+(window.__fromBundle||bi?'<button type="button" class="btn danger" data-o="fab">Versão de fábrica</button>':''),
      on:{

        inst:function(a){a.close();toast('Baixando…');installOnline(nv).then(reiniciar,function(e){toast(e.message);updModal()})},
        file:function(a){a.close();installFile().then(function(v){if(v)reiniciar(v)},function(e){toast(e.message)})},
        repo:function(a){a.close();repoDialog()},
        fab:function(a){a.close();fabrica()}
      }});
  });
}

      if(p1.length<6)throw new Error('A senha precisa ter pelo menos 6 caracteres.');

      return newCred(p1).then(function(c){return saveUser(Object.assign({},u,c))}).then(function(){toast('Senha trocada.')});
    }});
}
function mySenha(){
  modal('Trocar minha senha',F('Senha atual','m-p0','password','','','autocomplete="current-password"')+F('Nova senha','m-p1','password','','Pelo menos 6 caracteres','autocomplete="new-password"')+F('Repita a nova senha','m-p2','password','','','autocomplete="new-password"'),
    {submit:'Trocar senha',onSubmit:function(f){
      var u=usersAll().filter(function(x){return x.id===cur.id})[0];
      var p0=f.elements['m-p0'].value,p1=f.elements['m-p1'].value,p2=f.elements['m-p2'].value;
      if(p1.length<6)throw new Error('A nova senha precisa ter pelo menos 6 caracteres.');
      if(p1!==p2)throw new Error('As senhas não são iguais.');
      return verifyUser(u,p0).then(function(ok){
        if(!ok)throw new Error('A senha atual está incorreta.');
        return newCred(p1);
      }).then(function(c){return saveUser(Object.assign({},u,c))}).then(function(){toast('Senha trocada.')});
    }});
}

var errsPos=0;
function afterLogin(){
  banner();
  autoCheck();
  window.addEventListener('error',function(){errsPos++});
  setTimeout(function(){
    var v=document.getElementById('view');
    if(window.__fromBundle&&(errsPos>0||!v||!v.firstElementChild||/Carregando/.test(v.textContent||''))){OFF.badBoot=true;banner()}
  },3500);
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
}

  var theme=null;
  loadAll().then(function(){
    var p;

  });
}
window.__OFF.boot=boot;
boot();

})();});
